# Hierarchy: indentation and columns (CORE "Hierarchy"). The authoritative
# parser rule: pop while new_column <= stack_top.base_column. Inline elements
# are pushed at their real columns, exactly as if on separate lines.
#
# These encode CORE's own worked examples (also listed in CORE "Test Cases").

- id: inline_nesting_chain
  desc: inline elements nest left to right
  udon: "|one |two |three\n"
  events:
    - ElementStart
    - [Name, "one"]
    - ElementStart
    - [Name, "two"]
    - ElementStart
    - [Name, "three"]
    - ElementEnd
    - ElementEnd
    - ElementEnd

- id: vertical_equivalent_of_inline
  desc: the vertical form at the same columns is identical
  udon: "|one\n     |two\n          |three\n"
  events:
    - ElementStart
    - [Name, "one"]
    - ElementStart
    - [Name, "two"]
    - ElementStart
    - [Name, "three"]
    - ElementEnd
    - ElementEnd
    - ElementEnd

- id: sibling_after_inline_elements
  desc: column 2 pops three and two, alpha is child of one
  udon: "|one |two |three\n  |alpha\n"
  events:
    - ElementStart
    - [Name, "one"]
    - ElementStart
    - [Name, "two"]
    - ElementStart
    - [Name, "three"]
    - ElementEnd
    - ElementEnd
    - ElementStart
    - [Name, "alpha"]
    - ElementEnd
    - ElementEnd

- id: column_alignment_is_sibling
  desc: same column as |two means sibling of |two (child of one)
  udon: "|one |two |three\n     |alpha\n"
  events:
    - ElementStart
    - [Name, "one"]
    - ElementStart
    - [Name, "two"]
    - ElementStart
    - [Name, "three"]
    - ElementEnd
    - ElementEnd
    - ElementStart
    - [Name, "alpha"]
    - ElementEnd
    - ElementEnd

- id: child_of_inline_element
  desc: a column between two's and three's pipes is a child of two
  udon: "|one |two |three\n        |alpha\n"
  events:
    - ElementStart
    - [Name, "one"]
    - ElementStart
    - [Name, "two"]
    - ElementStart
    - [Name, "three"]
    - ElementEnd
    - ElementStart
    - [Name, "alpha"]
    - ElementEnd
    - ElementEnd
    - ElementEnd

- id: child_at_inline_child_column
  desc: same column as |three is a sibling of three, child of two
  udon: "|one |two |three\n          |alpha\n"
  events:
    - ElementStart
    - [Name, "one"]
    - ElementStart
    - [Name, "two"]
    - ElementStart
    - [Name, "three"]
    - ElementEnd
    - ElementStart
    - [Name, "alpha"]
    - ElementEnd
    - ElementEnd
    - ElementEnd

- id: multiline_progression
  desc: child of two, then sibling of two
  udon: "|one |two |three\n       |alpha\n     |beta\n"
  events:
    - ElementStart
    - [Name, "one"]
    - ElementStart
    - [Name, "two"]
    - ElementStart
    - [Name, "three"]
    - ElementEnd
    - ElementStart
    - [Name, "alpha"]
    - ElementEnd
    - ElementEnd
    - ElementStart
    - [Name, "beta"]
    - ElementEnd
    - ElementEnd

- id: popped_columns_are_dead
  desc: only the previous line's stack matters; old inline columns are closed
  udon: "|one |two |three\n  |alpha\n     |beta\n"
  events:
    - ElementStart
    - [Name, "one"]
    - ElementStart
    - [Name, "two"]
    - ElementStart
    - [Name, "three"]
    - ElementEnd
    - ElementEnd
    - ElementStart
    - [Name, "alpha"]
    - ElementStart
    - [Name, "beta"]
    - ElementEnd
    - ElementEnd
    - ElementEnd

- id: many_inline_elements
  desc: deep inline chain with two returns to earlier columns
  udon: "|a |b |c |d\n         |child-of-c\n   |child-of-a\n"
  events:
    - ElementStart
    - [Name, "a"]
    - ElementStart
    - [Name, "b"]
    - ElementStart
    - [Name, "c"]
    - ElementStart
    - [Name, "d"]
    - ElementEnd
    - ElementStart
    - [Name, "child-of-c"]
    - ElementEnd
    - ElementEnd
    - ElementEnd
    - ElementStart
    - [Name, "child-of-a"]
    - ElementEnd
    - ElementEnd

- id: closing_multiple_levels
  desc: a column-0 line closes every open element
  udon: "|one\n  |two\n    |three\n      |four\nprose sibling to one\n"
  events:
    - ElementStart
    - [Name, "one"]
    - ElementStart
    - [Name, "two"]
    - ElementStart
    - [Name, "three"]
    - ElementStart
    - [Name, "four"]
    - ElementEnd
    - ElementEnd
    - ElementEnd
    - ElementEnd
    - [Text, "prose sibling to one"]

- id: same_column_is_sibling_not_child
  desc: same column = sibling; one more column = child
  udon: "|parent\n  |child\n  |sibling\n   |inside\n"
  events:
    - ElementStart
    - [Name, "parent"]
    - ElementStart
    - [Name, "child"]
    - ElementEnd
    - ElementStart
    - [Name, "sibling"]
    - ElementStart
    - [Name, "inside"]
    - ElementEnd
    - ElementEnd
    - ElementEnd

- id: table_shaped_nesting
  desc: the table example — rows as column-aligned siblings, caption as child of table
  udon: "|table |tr |td A1\n           |td A2\n       |tr |td B1\n  |caption Table 1\n"
  events:
    - ElementStart
    - [Name, "table"]
    - ElementStart
    - [Name, "tr"]
    - ElementStart
    - [Name, "td"]
    - [Text, "A1"]
    - ElementEnd
    - ElementStart
    - [Name, "td"]
    - [Text, "A2"]
    - ElementEnd
    - ElementEnd
    - ElementStart
    - [Name, "tr"]
    - ElementStart
    - [Name, "td"]
    - [Text, "B1"]
    - ElementEnd
    - ElementEnd
    - ElementStart
    - [Name, "caption"]
    - [Text, "Table 1"]
    - ElementEnd
    - ElementEnd
