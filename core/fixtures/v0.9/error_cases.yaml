# Error + anomaly recovery (CORE "Anomaly posture", "End of input", "Strict
# Whitespace"). The parser keeps everything it can, emits an Error event for a
# genuine loss (e.g. a tab in indentation drops its line) or a Warning where
# content is kept (the Unclosed* family), and still closes open elements
# (balanced Start/End regardless).
#
# Codes are an implementation vocabulary (ParseErrorCode / the Warning-codes
# registry), not fixed prose by CORE. Two-level severity (CORE "End of input"):
# an Unclosed* construct keeps its content, so it is a WARNING, not an error.
# Fuller unclosed-construct coverage (embedded, inline comment, envelope, array,
# freeform, identity) lives in eof_recovery.yaml.

- id: tab_indentation_error
  desc: tabs are forbidden in indentation (strict whitespace)
  udon: "|el\n\t|child\n"
  events:
    - ElementStart
    - [Name, "el"]
    - [Error, "NoTabs"]
    - ElementEnd

- id: unclosed_double_quote_warns
  desc: an unclosed double-quoted value warns at EOF, content preserved
  udon: "|el :val \"unclosed"
  root_only: true
  events:
    - ElementStart
    - [Name, "el"]
    - [Attr, "val"]
    - [StringValue, "unclosed"]
    - [Warning, "UnclosedStringValue"]
    - ElementEnd

- id: unclosed_single_quote_warns
  desc: an unclosed single-quoted value warns at EOF, content preserved
  udon: "|el :val 'unclosed"
  root_only: true
  events:
    - ElementStart
    - [Name, "el"]
    - [Attr, "val"]
    - [StringValue, "unclosed"]
    - [Warning, "UnclosedStringValue"]
    - ElementEnd

- id: unclosed_interpolation_warns
  desc: an unclosed interpolation warns at EOF, captured content preserved
  udon: "|p total is !{{count"
  root_only: true
  events:
    - ElementStart
    - [Name, "p"]
    - [Text, "total is "]
    - [Interpolation, "count"]
    - [Warning, "UnclosedInterpolation"]
    - ElementEnd

- id: elements_still_close_after_error
  desc: nested elements all close after an error line
  udon: "|a\n  |b\n\t|c\n"
  events:
    - ElementStart
    - [Name, "a"]
    - ElementStart
    - [Name, "b"]
    - [Error, "NoTabs"]
    - ElementEnd
    - ElementEnd
