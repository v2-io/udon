# Dynamics SYNTAX only (CORE "Dynamics (`!`) — a baseline dialect", "Code and
# Raw Content", "Unified Inline Syntax"). The core recognizes `!` forms and
# emits events; the expression language is the DYNAMICS.md dialect and is NOT
# asserted here — expressions are captured verbatim and unparsed.

# ---------------------------------------------------------------------------
# Block directives: !name at head position, any name, body parsed as UDON
# ---------------------------------------------------------------------------

- id: directive_with_body
  desc: directive with expression text and UDON body
  udon: "!if logged_in\n  |greeting Welcome back!\n"
  events:
    - DirectiveStart
    - [Name, "if"]
    - [Text, "logged_in"]
    - ElementStart
    - [Name, "greeting"]
    - [Text, "Welcome back!"]
    - ElementEnd
    - DirectiveEnd

- id: directive_any_name
  desc: the parser does not enumerate directive names
  udon: "!frobnicate all the things\n"
  events:
    - DirectiveStart
    - [Name, "frobnicate"]
    - [Text, "all the things"]
    - DirectiveEnd

- id: directive_expression_verbatim
  desc: the expression is captured verbatim, unparsed
  udon: "!if age >= 18 and verified\n  |p adult\n"
  events:
    - DirectiveStart
    - [Name, "if"]
    - [Text, "age >= 18 and verified"]
    - ElementStart
    - [Name, "p"]
    - [Text, "adult"]
    - ElementEnd
    - DirectiveEnd

- id: sibling_directives
  desc: dedent closes a directive; a sibling directive follows
  udon: "!if x\n  |p yes\n!else\n  |p no\n"
  events:
    - DirectiveStart
    - [Name, "if"]
    - [Text, "x"]
    - ElementStart
    - [Name, "p"]
    - [Text, "yes"]
    - ElementEnd
    - DirectiveEnd
    - DirectiveStart
    - [Name, "else"]
    - ElementStart
    - [Name, "p"]
    - [Text, "no"]
    - ElementEnd
    - DirectiveEnd

# ---------------------------------------------------------------------------
# Interpolation !{{expr}} — expression unparsed; prose-level form
# ---------------------------------------------------------------------------

- id: interpolation_in_prose
  desc: interpolation interrupts prose text
  udon: "|p Hello, !{{user.name}}!\n"
  events:
    - ElementStart
    - [Name, "p"]
    - [Text, "Hello, "]
    - [Interpolation, "user.name"]
    - [Text, "!"]
    - ElementEnd

- id: interpolation_with_filters
  desc: filter chains are part of the verbatim expression
  udon: "|p !{{name | capitalize}}\n"
  events:
    - ElementStart
    - [Name, "p"]
    - [Interpolation, "name | capitalize"]
    - ElementEnd

- id: interpolation_empty
  desc: empty interpolation is valid; the host decides what it means
  udon: "|p x !{{}} y\n"
  events:
    - ElementStart
    - [Name, "p"]
    - [Text, "x "]
    - [Interpolation, ""]
    - [Text, " y"]
    - ElementEnd

- id: interpolation_at_head_is_prose_level
  desc: head-position interpolation is prose-level, not a block directive (also in markers.yaml)
  udon: "|el\n  !{{content}}\n"
  events:
    - ElementStart
    - [Name, "el"]
    - [Interpolation, "content"]
    - ElementEnd

# ---------------------------------------------------------------------------
# Raw block !:lang: — body verbatim, dedented relative to the raw base
# ---------------------------------------------------------------------------
# The raw base is the FIRST CONTENT LINE's column (pinned in CORE "Raw
# Directives" — same shape as prose content-base); deeper lines keep their
# extra indent. The body may also begin on the directive line itself (ruled
# 2026-07-16): whitespace after the label's closing ':' separates, the tail
# is the first RawContent, and it does not establish the raw base.

- id: raw_block_sameline_body
  desc: body may begin on the directive line; the tail is the first RawContent
  udon: "!:sh: echo hi\n"
  events:
    - DirectiveStart
    - [Name, "sh"]
    - [Raw, ""]
    - [RawContent, "echo hi"]
    - DirectiveEnd

- id: raw_block_sameline_body_then_block
  desc: same-line tail plus indented body; raw base set by the first INDENTED line
  udon: "!:sh: echo one\n  echo two\n    indented\n"
  events:
    - DirectiveStart
    - [Name, "sh"]
    - [Raw, ""]
    - [RawContent, "echo one"]
    - [RawContent, "echo two"]
    - [RawContent, "  indented"]
    - DirectiveEnd

- id: raw_block_sameline_body_eof
  desc: same-line tail at EOF — emitted, never dropped (EOF closes silently)
  udon: "!:sh: echo hi"
  events:
    - DirectiveStart
    - [Name, "sh"]
    - [Raw, ""]
    - [RawContent, "echo hi"]
    - DirectiveEnd

- id: raw_block_node_value_sameline_body
  desc: raw node value with a same-line body (uniform — CORE Raw Directives)
  udon: "|el :script !:sh: make build\n"
  events:
    - ElementStart
    - [Name, "el"]
    - [Attr, "script"]
    - DirectiveStart
    - [Name, "sh"]
    - [Raw, ""]
    - [RawContent, "make build"]
    - DirectiveEnd
    - ElementEnd

- id: raw_block_sameline_body_in_element
  desc: same-line body on an indented raw block inside an element
  udon: "|example\n  !:sql: SELECT 1\n"
  events:
    - ElementStart
    - [Name, "example"]
    - DirectiveStart
    - [Name, "sql"]
    - [Raw, ""]
    - [RawContent, "SELECT 1"]
    - DirectiveEnd
    - ElementEnd

- id: raw_block_sameline_body_then_dedent_prose
  desc: a same-line body does not change the block-end rule — a line at the directive's column ends it
  udon: "|x\n  !:sh: echo hi\n  back to prose\n"
  events:
    - ElementStart
    - [Name, "x"]
    - DirectiveStart
    - [Name, "sh"]
    - [Raw, ""]
    - [RawContent, "echo hi"]
    - DirectiveEnd
    - [Text, "back to prose"]
    - ElementEnd

# "The rest of the line is the body's first content" (ruled 2026-07-16), and
# a raw body is captured verbatim — no ';' interpretation — so a framed
# ' ; ' in the same-line tail is body, not a comment.
- id: raw_block_sameline_body_semicolon_is_body
  desc: a framed ' ; ' in a raw same-line body is verbatim body content
  udon: "!:sh: echo hi ; not a comment\n"
  events:
    - DirectiveStart
    - [Name, "sh"]
    - [Raw, ""]
    - [RawContent, "echo hi ; not a comment"]
    - DirectiveEnd

- id: raw_block_node_value_sameline_body_plus_block
  desc: node value with same-line body AND indented continuation — the indented line sets the raw base; the block ends at the LINE's structural column
  udon: "|el :script !:sh: make build\n  make test\n"
  events:
    - ElementStart
    - [Name, "el"]
    - [Attr, "script"]
    - DirectiveStart
    - [Name, "sh"]
    - [Raw, ""]
    - [RawContent, "make build"]
    - [RawContent, "make test"]
    - DirectiveEnd
    - ElementEnd

# Flag rule 2 re-owns non-keyword material to the continuing scan, and a
# guarded '!' is in the boundary marker set — so the raw block is the
# ELEMENT's child while the flag settles true (the flag analogue of
# ':a? |beta'; contrast raw_block_node_value_sameline where a PLAIN attr is
# the raw node). Body rules per the sameline-opened form: raw base = first
# content line's column, end at the line's structural column. (Green since the
# element's sameline '!' guard was completed to match the block-line contexts.)
- id: flag_then_raw_block_is_child
  desc: "after a flag key, a sameline raw block is the element's child, not the flag's value"
  udon: "|el :go? !:sh:\n  echo hi\n"
  events:
    - ElementStart
    - [Name, "el"]
    - [Attr, "go?"]
    - BoolTrue
    - DirectiveStart
    - [Name, "sh"]
    - [Raw, ""]
    - [RawContent, "echo hi"]
    - DirectiveEnd
    - ElementEnd

- id: raw_block_basic
  desc: colon-wrapped label opens a raw block; body is not parsed as UDON
  udon: "!:elixir:\n  def hello do\n    IO.puts(\"world\")\n  end\n"
  events:
    - DirectiveStart
    - [Name, "elixir"]
    - [Raw, ""]
    - [RawContent, "def hello do"]
    - [RawContent, "  IO.puts(\"world\")"]
    - [RawContent, "end"]
    - DirectiveEnd

- id: raw_block_markers_inert
  desc: UDON markers inside a raw block are not interpreted
  udon: "!:elixir:\n  value |> transform()\n  ; not a comment\n  :not an attr\n"
  events:
    - DirectiveStart
    - [Name, "elixir"]
    - [Raw, ""]
    - [RawContent, "value |> transform()"]
    - [RawContent, "; not a comment"]
    - [RawContent, ":not an attr"]
    - DirectiveEnd

- id: raw_block_inside_element
  desc: raw block indents under its parent element
  udon: "|example\n  !:sql:\n    SELECT * FROM users\n"
  events:
    - ElementStart
    - [Name, "example"]
    - DirectiveStart
    - [Name, "sql"]
    - [Raw, ""]
    - [RawContent, "SELECT * FROM users"]
    - DirectiveEnd
    - ElementEnd

# ---------------------------------------------------------------------------
# Inline raw !{:kind: ...} — brace-counted
# ---------------------------------------------------------------------------

- id: inline_raw_json
  desc: inline raw with balanced nested braces
  udon: "|p The response was !{:json: {\"status\": \"ok\"}} as expected.\n"
  events:
    - ElementStart
    - [Name, "p"]
    - [Text, "The response was "]
    - DirectiveStart
    - [Name, "json"]
    - [Raw, ""]
    - [RawContent, "{\"status\": \"ok\"}"]
    - DirectiveEnd
    - [Text, " as expected."]
    - ElementEnd

- id: inline_raw_regex_braces
  desc: brace-counting handles regex quantifiers when balanced
  udon: "|p match !{:regex: [a-z]{3,5}} here\n"
  events:
    - ElementStart
    - [Name, "p"]
    - [Text, "match "]
    - DirectiveStart
    - [Name, "regex"]
    - [Raw, ""]
    - [RawContent, "[a-z]{3,5}"]
    - DirectiveEnd
    - [Text, " here"]
    - ElementEnd

# ---------------------------------------------------------------------------
# Inline directive !{name ...} — body parsed as UDON
# ---------------------------------------------------------------------------

- id: inline_directive_with_udon_body
  desc: non-raw inline directives support nested UDON
  udon: "|p !{include |{em emphasized} content}\n"
  events:
    - ElementStart
    - [Name, "p"]
    - DirectiveStart
    - [Name, "include"]
    - EmbeddedStart
    - [Name, "em"]
    - [Text, "emphasized"]
    - EmbeddedEnd
    - [Text, " content"]
    - DirectiveEnd
    - ElementEnd
