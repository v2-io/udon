# Attributes under the 0.9 model (CORE "Attributes", ratified 2026-07-15/16):
# uniform scan, plain-attrs-always-take-a-value, text blobs, flat stacking
# wire (every Attr carries exactly one value; multiplicity = re-emitted Attr).
#
# MissingAttributeValue event order (Attr / Error / Nil) is provisional —
# the error explains the synthesized Nil that follows. Adjust here + grammar
# together if a different order proves more natural.

# ---------------------------------------------------------------------------
# Text blobs as values (CORE "The Scan and the Bare-Token Boundary",
# "Text-Blob Values"): an open attr's bare token followed by plain text
# commits the rest of the line to the attr as a text blob.
# ---------------------------------------------------------------------------

- id: block_value_text_blob
  desc: block attribute bare value with spaces is a text blob owned by the attr
  udon: "|el\n  :author Alice Smith\n"
  events:
    - ElementStart
    - [Name, "el"]
    - [Attr, "author"]
    - [Text, "Alice Smith"]
    - ElementEnd

- id: sameline_open_attr_takes_blob
  desc: sameline open attr takes the whole trailing text blob (E1 ruling)
  udon: "|el :author Alice Smith\n"
  events:
    - ElementStart
    - [Name, "el"]
    - [Attr, "author"]
    - [Text, "Alice Smith"]
    - ElementEnd

- id: sameline_quoted_value_with_spaces
  desc: a quoted value self-terminates; no blob
  udon: "|el :author \"Alice Smith\"\n"
  events:
    - ElementStart
    - [Name, "el"]
    - [Attr, "author"]
    - [StringValue, "Alice Smith"]
    - ElementEnd

- id: multiple_sameline_attrs
  desc: bare token followed by ':' at the boundary is a single-token value
  udon: "|el :key1 value1 :key2 value2\n"
  events:
    - ElementStart
    - [Name, "el"]
    - [Attr, "key1"]
    - [BareValue, "value1"]
    - [Attr, "key2"]
    - [BareValue, "value2"]
    - ElementEnd

- id: block_value_url_semicolon_kept
  desc: a semicolon without whitespace framing is part of the token
  udon: "|el\n  :url https://example.com/path?q=1;s=2\n"
  events:
    - ElementStart
    - [Name, "el"]
    - [Attr, "url"]
    - [BareValue, "https://example.com/path?q=1;s=2"]
    - ElementEnd

- id: block_blob_space_semicolon_is_comment
  desc: a framed ' ; ' ends the text blob and starts a comment
  udon: "|el\n  :note this has a semicolon too ; but THIS is a comment\n"
  events:
    - ElementStart
    - [Name, "el"]
    - [Attr, "note"]
    - [Text, "this has a semicolon too"]
    - CommentStart
    - [Text, " but THIS is a comment"]
    - CommentEnd
    - ElementEnd

# ---------------------------------------------------------------------------
# Uniform scan on block lines (CORE "The Scan"): block run-to-EOL is gone.
# ---------------------------------------------------------------------------

- id: block_line_uniform_scan
  desc: a block line holds multiple attributes (0.8 swallowed ":cttr 3" into bttr)
  udon: "|el\n  :bttr 2 :cttr 3\n"
  events:
    - ElementStart
    - [Name, "el"]
    - [Attr, "bttr"]
    - [Integer, "2"]
    - [Attr, "cttr"]
    - [Integer, "3"]
    - ElementEnd

# ---------------------------------------------------------------------------
# Plain attributes always take a value (CORE "Attribute Keys and Flags"):
# valueless plain attr = non-halting error + synthesized Nil (ruled
# 2026-07-16 — the stream never carries less shape than the source
# suggested). Flags live in flags.yaml.
# ---------------------------------------------------------------------------

- id: plain_attr_valueless_sameline_error
  desc: plain attr followed by another attr errors and emits Nil
  udon: "|button :disabled :type submit\n"
  events:
    - ElementStart
    - [Name, "button"]
    - [Attr, "disabled"]
    - [Error, "MissingAttributeValue"]
    - Nil
    - [Attr, "type"]
    - [BareValue, "submit"]
    - ElementEnd

- id: plain_attr_valueless_block_error
  desc: plain attr at EOL with nothing deeper errors and emits Nil
  udon: "|config\n  :debug\n"
  events:
    - ElementStart
    - [Name, "config"]
    - [Attr, "debug"]
    - [Error, "MissingAttributeValue"]
    - Nil
    - ElementEnd

- id: embedded_plain_attr_valueless_error
  desc: valueless plain attr inside embedded errors too (R2 — write :required?)
  udon: "|p x |{input :required} y\n"
  events:
    - ElementStart
    - [Name, "p"]
    - [Text, "x "]
    - EmbeddedStart
    - [Name, "input"]
    - [Attr, "required"]
    - [Error, "MissingAttributeValue"]
    - Nil
    - EmbeddedEnd
    - [Text, " y"]
    - ElementEnd

# ---------------------------------------------------------------------------
# Attribute stacking — the uniform rule (unchanged from 0.8)
# ---------------------------------------------------------------------------

- id: same_key_stacks
  desc: repeated keys each emit their own Attr, in source order (never last-wins)
  udon: "|el :x 1 :x 2\n"
  events:
    - ElementStart
    - [Name, "el"]
    - [Attr, "x"]
    - [Integer, "1"]
    - [Attr, "x"]
    - [Integer, "2"]
    - ElementEnd

- id: stacking_and_lists_compose
  desc: stacking and list values are orthogonal multiplicity axes
  udon: "|el :x [1 2] :x [3]\n"
  events:
    - ElementStart
    - [Name, "el"]
    - [Attr, "x"]
    - ArrayStart
    - [Integer, "1"]
    - [Integer, "2"]
    - ArrayEnd
    - [Attr, "x"]
    - ArrayStart
    - [Integer, "3"]
    - ArrayEnd
    - ElementEnd

- id: stacking_across_block_lines
  desc: stacking applies across separate block attribute lines
  udon: "|el\n  :tag a\n  :tag b\n"
  events:
    - ElementStart
    - [Name, "el"]
    - [Attr, "tag"]
    - [BareValue, "a"]
    - [Attr, "tag"]
    - [BareValue, "b"]
    - ElementEnd

# ---------------------------------------------------------------------------
# Embedded attribute values (R2: element-rooted sameline + '}' terminator)
# ---------------------------------------------------------------------------

- id: embedded_value_terminated_by_brace
  desc: a closing brace at the boundary finishes a single-token value
  udon: "|p go |{a :href /home} now\n"
  events:
    - ElementStart
    - [Name, "p"]
    - [Text, "go "]
    - EmbeddedStart
    - [Name, "a"]
    - [Attr, "href"]
    - [BareValue, "/home"]
    - EmbeddedEnd
    - [Text, " now"]
    - ElementEnd

- id: embedded_open_attr_blob_swallows_tail
  desc: open bare attr's blob runs to } — no embedded content (R2 gallery)
  udon: "|p x |{a :href /home :title Home here} y\n"
  events:
    - ElementStart
    - [Name, "p"]
    - [Text, "x "]
    - EmbeddedStart
    - [Name, "a"]
    - [Attr, "href"]
    - [BareValue, "/home"]
    - [Attr, "title"]
    - [Text, "Home here"]
    - EmbeddedEnd
    - [Text, " y"]
    - ElementEnd

- id: embedded_quoted_value_leaves_content
  desc: quoting the value leaves the tail as embedded content (R2 gallery)
  udon: "|p x |{a :href /home :title \"Home\" here} y\n"
  events:
    - ElementStart
    - [Name, "p"]
    - [Text, "x "]
    - EmbeddedStart
    - [Name, "a"]
    - [Attr, "href"]
    - [BareValue, "/home"]
    - [Attr, "title"]
    - [StringValue, "Home"]
    - [Text, "here"]
    - EmbeddedEnd
    - [Text, " y"]
    - ElementEnd

- id: embedded_boundary_backslash_gives_content
  desc: boundary-\ closes the value and forces the tail to embedded content (R2 gallery)
  udon: "|p x |{a :href /home :title Home \\ Welcome home!} y\n"
  events:
    - ElementStart
    - [Name, "p"]
    - [Text, "x "]
    - EmbeddedStart
    - [Name, "a"]
    - [Attr, "href"]
    - [BareValue, "/home"]
    - [Attr, "title"]
    - [BareValue, "Home"]
    - [Text, " Welcome home!"]
    - EmbeddedEnd
    - [Text, " y"]
    - ElementEnd

# ---------------------------------------------------------------------------
# Attributes before children (unchanged); phase-change warning is in
# attr_boundary.yaml.
# ---------------------------------------------------------------------------

- id: attrs_then_children
  desc: attributes precede child content
  udon: "|element :attr1 value1\n  child prose here\n"
  events:
    - ElementStart
    - [Name, "element"]
    - [Attr, "attr1"]
    - [BareValue, "value1"]
    - [Text, "child prose here"]
    - ElementEnd
