# J3. REFERENCE SELECTOR BRACKET  @el[k
#     Ruled IN PRINCIPLE (CORE Identity §"Unclosed key → $partial-key":
#     "and likewise for a reference's selector key") — an unclosed reference
#     key should warn UnclosedIdentityKey and fail safe. But the interim
#     reference wire is a single raw-text Reference event with no key attr,
#     so there is no $partial-key surface to assert yet: the concrete shape
#     lands with the structured reference encoding (spec/TODO-SPEC-CORE.md)
#     + the shared identity-scan grammar work (core/TODO-CORE-PARSING.md).
#     Until then this is a no-panic probe of current behavior (the parser
#     swallows "el[k" as the Reference payload, no warning).
- id: du_gap_reference_bracket_unclosed_eof
  desc: "unclosed [ in a @reference selector — ruled to warn+fail-safe; wire shape awaits the structured reference encoding"
  udon: "@el[k"
  root_only: true
  events: []
