# EOF/edge cases promoted from _wip/delimited-unclosed.yaml (2026-07-19 densification).
# Spec-derived (CORE + CHANGELOG alpha.2 Ruled), verified green vs the current
# parser. See _wip/FINDINGS.md for the triage.

- id: du_str_double_opener_only
  desc: '" opened then EOF, nothing captured — empty StringValue + warning'
  udon: '|el :k "'
  root_only: true
  # CORE: "captured content is kept ... may be nothing beyond the opener" + UnclosedStringValue
  events:
    - ElementStart
    - [Name, "el"]
    - [Attr, "k"]
    - [StringValue, ""]
    - [Warning, "UnclosedStringValue"]
    - ElementEnd

- id: du_str_single_opener_only
  desc: "' opened then EOF, nothing captured — empty StringValue + warning"
  udon: "|el :k '"
  root_only: true
  # CORE "Strings": '...' is equally a string; same EOF rule.
  events:
    - ElementStart
    - [Name, "el"]
    - [Attr, "k"]
    - [StringValue, ""]
    - [Warning, "UnclosedStringValue"]
    - ElementEnd

- id: du_str_sameline_partial
  desc: sameline double-quote with partial content at EOF
  udon: '|el :k "abc'
  root_only: true
  # CORE "End of input": captured content ("abc") kept + UnclosedStringValue.
  events:
    - ElementStart
    - [Name, "el"]
    - [Attr, "k"]
    - [StringValue, "abc"]
    - [Warning, "UnclosedStringValue"]
    - ElementEnd

# RULED since the harvest (CORE "Line-boundedness", 2026-07-18): string
# multi-line spanning is DELIBERATELY UNDEFINED in this version; the current
# parser spans (the newline is content), and "either may change."
- id: du_str_newline_inside_is_content
  desc: "newline inside \"...\" is captured as content — PINS CURRENT BEHAVIOR (multi-line deliberately undefined)"
  udon: "|el :k \"abc\ndef"
  root_only: true
  # PINS CURRENT BEHAVIOR (descriptive, not prescriptive): CORE Line-boundedness
  # deliberately leaves string spanning undefined; this case regression-pins
  # today's behavior so it can't drift silently, not a spec position. A future
  # ruling may flip it. Closed-spanning variants: exploratory/multi-line.yaml.
  events:
    - ElementStart
    - [Name, "el"]
    - [Attr, "k"]
    - [StringValue, "abc\ndef"]
    - [Warning, "UnclosedStringValue"]
    - ElementEnd


# ===========================================================================
# B. ARRAYS  [...]
#    CORE "Inline Lists", "Contexts and Terminators" (closes only on ']',
#    else UnclosedArray). Wire shape (arrays.yaml/eof_recovery.yaml): items,
#    then [Warning, UnclosedArray], then ArrayEnd. Array multi-line is
#    DELIBERATELY UNDEFINED (CORE "Line-boundedness"); the current parser
#    closes on the newline with UnclosedArray — the EOF cases here are
#    prescriptive (ruled), the interior-newline case is a DESCRIPTIVE pin of
#    current behavior. Already covered: eof_unclosed_array (EOF, items),
#    array_unclosed_warns (newline), eof_unclosed_array_nested. These add
#    opener-only + the interior-newline "rest becomes prose" behavior.
# ===========================================================================

- id: du_arr_opener_only_eof
  desc: "[ opened then EOF, no items — ArrayStart + UnclosedArray + ArrayEnd"
  udon: "|el :xs ["
  root_only: true
  # CORE "End of input": empty capture kept; UnclosedArray; ArrayEnd flushes.
  events:
    - ElementStart
    - [Name, "el"]
    - [Attr, "xs"]
    - ArrayStart
    - [Warning, "UnclosedArray"]
    - ArrayEnd
    - ElementEnd

# The newline soft-closes the array (UnclosedArray at the newline), and
# everything after it is ordinary document material — here the "2]" on the
# next line is prose of |el.
- id: du_arr_newline_closes_rest_is_prose
  desc: interior newline soft-closes the array; the following line is prose — PINS CURRENT BEHAVIOR
  udon: "|el :x [1\n  2]"
  root_only: true
  # PINS CURRENT BEHAVIOR (descriptive, not prescriptive): array multi-line is
  # deliberately undefined (CORE Line-boundedness); today a newline closes the
  # array with UnclosedArray and "2]" parses as prose. A future ruling may make
  # arrays multi-line, flipping this to a clean 2-item array.
  # (Document result here is SUCCESS — complete doc — vs non-success for the
  #  EOF twin; un-assertable in event fixtures, see the infrastructure note.)
  events:
    - ElementStart
    - [Name, "el"]
    - [Attr, "x"]
    - ArrayStart
    - [Integer, "1"]
    - [Warning, "UnclosedArray"]
    - ArrayEnd
    - [Text, "2]"]
    - ElementEnd

# Sameline (element-line) array value, opener + one item, EOF — same row as
# block but element-line context, to pin the terminator uniformity.
- id: du_arr_sameline_partial_eof
  desc: sameline array value with one item at EOF
  udon: "|el :xs [1"
  root_only: true
  # CORE "Contexts and Terminators": array grammar uniform across contexts.
  events:
    - ElementStart
    - [Name, "el"]
    - [Attr, "xs"]
    - ArrayStart
    - [Integer, "1"]
    - [Warning, "UnclosedArray"]
    - ArrayEnd
    - ElementEnd


# ===========================================================================
# C. EMBEDDED  |{...}
#    CORE "Inline and Embedded Elements"; "Attributes" (embedded = element-
#    rooted sameline). NOT line-bound (spans lines). Code UnclosedEmbedded.
#    Wire shape (eof_unclosed_embedded): content, [Warning, UnclosedEmbedded],
#    EmbeddedEnd.
#
#    The any-phase EOF-DROP BUG these cases were harvested against (warning
#    emitted only once CONTENT had begun; dropped in bare-opener / identity /
#    attr phases) was FIXED 2026-07-18 by the generated delimited force-unwind
#    (descent classification landing) — the warning now fires in every phase.
#    These are green regression pins of that fix. (The content-phase cases
#    eof_unclosed_embedded / _nested already passed; not duplicated here.)
# ===========================================================================

- id: du_embed_bare_opener_eof
  desc: "|{ opened then EOF, no name yet — UnclosedEmbedded still required"
  udon: "|p |{"
  root_only: true
  # CORE "End of input": a still-open delimited frame warns even if nothing
  # beyond the opener was captured. Anonymous embed, empty.
  events:
    - ElementStart
    - [Name, "p"]
    - EmbeddedStart
    - [Warning, "UnclosedEmbedded"]
    - EmbeddedEnd
    - ElementEnd

- id: du_embed_identity_phase_eof
  desc: "|{a — name captured, no content — UnclosedEmbedded required (RED)"
  udon: "|p |{a"
  root_only: true
  # CORE: name is kept; frame still open at EOF ⇒ UnclosedEmbedded.
  events:
    - ElementStart
    - [Name, "p"]
    - EmbeddedStart
    - [Name, "a"]
    - [Warning, "UnclosedEmbedded"]
    - EmbeddedEnd
    - ElementEnd

- id: du_embed_attr_open_missing_value_eof
  desc: "|{a :href — open plain attr (MissingAttributeValue) then UnclosedEmbedded (RED)"
  udon: "|p |{a :href"
  root_only: true
  # CORE "Attribute Keys and Flags": plain :key with no value ⇒
  # MissingAttributeValue ERROR + synthesized Nil (positional, semantic-at-
  # close). CORE "End of input": embed frame still open ⇒ UnclosedEmbedded.
  # Same input as eof_recovery::eof_unclosed_embedded_with_open_attr (kept in
  # both files through promotion — dedup candidate).
  events:
    - ElementStart
    - [Name, "p"]
    - EmbeddedStart
    - [Name, "a"]
    - [Attr, "href"]
    - [Error, "MissingAttributeValue"]
    - Nil
    - [Warning, "UnclosedEmbedded"]
    - EmbeddedEnd
    - ElementEnd

- id: du_embed_flag_then_eof
  desc: "|{a :ready? — flag snaps true, then UnclosedEmbedded (RED)"
  udon: "|p |{a :ready?"
  root_only: true
  # CORE "Flag rule": :ready? at boundary (EOF) snaps to true, no
  # MissingAttributeValue. CORE "End of input": embed frame open ⇒ warning.
  # (Good contrast to du_embed_attr_open_*: flag ⇒ no error, plain ⇒ error.)
  events:
    - ElementStart
    - [Name, "p"]
    - EmbeddedStart
    - [Name, "a"]
    - [Attr, "ready?"]
    - BoolTrue
    - [Warning, "UnclosedEmbedded"]
    - EmbeddedEnd
    - ElementEnd

- id: du_embed_attr_value_then_eof
  desc: "|{a :href /home — bare value finishes at EOF-boundary, then UnclosedEmbedded (RED)"
  udon: "|p |{a :href /home"
  root_only: true
  # CORE "The Scan and the Bare-Token Boundary": EOF is a boundary marker, so
  # the bare token "/home" finishes as a single-token value (BareValue), same
  # as the embedded_multiline fixture's "/docs". CORE "End of input": embed
  # still open ⇒ UnclosedEmbedded.
  events:
    - ElementStart
    - [Name, "p"]
    - EmbeddedStart
    - [Name, "a"]
    - [Attr, "href"]
    - [BareValue, "/home"]
    - [Warning, "UnclosedEmbedded"]
    - EmbeddedEnd
    - ElementEnd

# Content-phase POSITIVE control that is NOT already in eof_recovery: name +
# one content word. Confirms the boundary — this one the parser DOES warn on.
- id: du_embed_content_phase_eof
  desc: "|{a x — content begun, so UnclosedEmbedded fires (positive control, not red)"
  udon: "|p |{a x"
  root_only: true
  # CORE "End of input": embed open ⇒ UnclosedEmbedded.
  events:
    - ElementStart
    - [Name, "p"]
    - EmbeddedStart
    - [Name, "a"]
    - [Text, "x"]
    - [Warning, "UnclosedEmbedded"]
    - EmbeddedEnd
    - ElementEnd


# ===========================================================================
# D. INLINE COMMENTS  ;{...}
#    CORE "Inline Comments"; brace-counted; NOT line-bound. Code
#    UnclosedInlineComment. Wire shape (eof_unclosed_inline_comment):
#    CommentStart, [Text ..], [Warning, UnclosedInlineComment], CommentEnd.
#    Already covered: eof_unclosed_inline_comment (content),
#    _nested_brace. These add opener-only, in-blob, and in-embed contexts.
# ===========================================================================

- id: du_ic_opener_only_eof
  desc: ";{ opened then EOF, empty — warning still fires"
  udon: "|p a ;{"
  root_only: true
  # CORE "End of input": empty capture kept + UnclosedInlineComment.
  # (The empty comment Text is omitted here as a foldable artifact.)
  events:
    - ElementStart
    - [Name, "p"]
    - [Text, "a "]
    - CommentStart
    - [Warning, "UnclosedInlineComment"]
    - CommentEnd
    - ElementEnd

# ;{..} unclosed INSIDE an embedded element that is ALSO unclosed — cascade.
# CORE "Contexts and Terminators": inside |{..} only ;{..} opens a comment.
- id: du_ic_in_unclosed_embed_eof
  desc: unclosed ;{ inside an unclosed |{ — inner comment warns, then embed warns
  udon: "|p |{em x ;{note"
  root_only: true
  # CORE: innermost-first — UnclosedInlineComment (content "note") then, since
  # the embed is in CONTENT phase, UnclosedEmbedded.
  # (An empty Text before UnclosedEmbedded is omitted here as foldable.)
  events:
    - ElementStart
    - [Name, "p"]
    - EmbeddedStart
    - [Name, "em"]
    - [Text, "x "]
    - CommentStart
    - [Text, "note"]
    - [Warning, "UnclosedInlineComment"]
    - CommentEnd
    - [Warning, "UnclosedEmbedded"]
    - EmbeddedEnd
    - ElementEnd


# ===========================================================================
# E. INTERPOLATION  !{{...}}
#    CORE "Unified Inline Syntax": ends at the FIRST }} — a single } is
#    expression content. NOT line-bound. Code UnclosedInterpolation. Wire
#    shape (error_cases unclosed_interpolation_error): [Interpolation, <expr>]
#    then [Warning, UnclosedInterpolation] — NO end event.
#    Already covered: unclosed_interpolation_error (prose),
#    eof_unclosed_interpolation_value_position (value). These add opener-only,
#    the lone-}-is-content rule, and array-item position.
# ===========================================================================

- id: du_interp_opener_only_eof
  desc: "!{{ opened then EOF, empty expression + warning"
  udon: "|p !{{"
  root_only: true
  # CORE: empty capture kept + UnclosedInterpolation.
  events:
    - ElementStart
    - [Name, "p"]
    - [Interpolation, ""]
    - [Warning, "UnclosedInterpolation"]
    - ElementEnd

- id: du_interp_in_unclosed_array_eof
  desc: unclosed !{{ as an array item, inside an unclosed [ — cascade
  udon: "|el :xs [!{{x"
  root_only: true
  # CORE "Value Kinds": Interpolation is a value kind ⇒ valid array item.
  # Innermost-first: UnclosedInterpolation then UnclosedArray + ArrayEnd.
  events:
    - ElementStart
    - [Name, "el"]
    - [Attr, "xs"]
    - ArrayStart
    - [Interpolation, "x"]
    - [Warning, "UnclosedInterpolation"]
    - [Warning, "UnclosedArray"]
    - ArrayEnd
    - ElementEnd


# ===========================================================================
# F. TYPING ENVELOPE  <...>
#    CORE "Explicit Typing": MULTI-LINE (settled 2026-07-18 — a newline inside
#    <...> is content; closes only on the matching '>' or EOF); interim
#    NoDialectsLoaded pass-through. Code UnclosedTypeEnvelope. Wire shape:
#    CONTENT-FIRST, uniform with every delimited construct — [BareValue,
#    "<..."] then the warning (the envelope was extracted into its own
#    /envelope fn, commit e377585, retiring the old warning-first order).
#    An UNCLOSED envelope warns UnclosedTypeEnvelope INSTEAD of
#    NoDialectsLoaded (it never completed, so nothing was offered to dialect
#    dispatch) — pinned by these cases; a one-sentence CORE mention is tracked
#    in spec/TODO-SPEC-CORE.md. Already covered: eof_unclosed_envelope (EOF),
#    eof_unclosed_envelope_in_unclosed_array. These add opener-only + the
#    multi-line-span-to-EOF case (graduated from exploratory/ when multi-line
#    settled).
# ===========================================================================

- id: du_env_opener_only_eof
  desc: "< opened in value position then EOF — UnclosedTypeEnvelope + captured \"<\""
  udon: "|el :when <"
  root_only: true
  # CORE "Explicit Typing" + "End of input": captured lexical form (just "<")
  # passed through as string; single UnclosedTypeEnvelope, no NoDialectsLoaded.
  events:
    - ElementStart
    - [Name, "el"]
    - [Attr, "when"]
    - [BareValue, "<"]
    - [Warning, "UnclosedTypeEnvelope"]
    - ElementEnd

- id: du_env_as_array_item_opener_only_eof
  desc: "< as an array item then EOF — envelope warns, then the array warns"
  udon: "|el :xs [<"
  root_only: true
  # CORE "Explicit Typing" (opens in array-item value position) + "End of input":
  # innermost-first — UnclosedTypeEnvelope + "<", then UnclosedArray + ArrayEnd.
  # (Mirrors eof_unclosed_envelope_in_unclosed_array with an empty payload.)
  events:
    - ElementStart
    - [Name, "el"]
    - [Attr, "xs"]
    - ArrayStart
    - [BareValue, "<"]
    - [Warning, "UnclosedTypeEnvelope"]
    - [Warning, "UnclosedArray"]
    - ArrayEnd
    - ElementEnd

# Multi-line span to EOF (settled multi-line, 2026-07-18; graduated from
# exploratory/multi-line.yaml once the behavior became defined): with no '>',
# the envelope swallows the following lines to EOF — newlines and interior
# indentation verbatim — then warns via the |unclosed force-unwind.
- id: du_env_multiline_unclosed_eof
  desc: never-closed envelope spans every following line to EOF, then warns
  udon: "|el :k <a\nb\nc"
  root_only: true
  events:
    - ElementStart
    - [Name, "el"]
    - [Attr, "k"]
    - [BareValue, "<a\nb\nc"]
    - [Warning, "UnclosedTypeEnvelope"]
    - ElementEnd


# ===========================================================================
# G. FREEFORM FENCE  ```
#    CORE "Triple-Backtick Escape". Closer = a line whose first non-space
#    content is ```. NOT line-bound (spans lines by nature). Code
#    UnclosedFreeform. Wire shape (eof_unclosed_freeform):
#    FreeformStart, [Text ..], [Warning, UnclosedFreeform], FreeformEnd.
#    Already covered: eof_unclosed_freeform (body),
#    eof_unclosed_freeform_in_element, freeform_unterminated_warns.
#    These add opener-only and info-string-no-newline.
# ===========================================================================

- id: du_freeform_opener_only_eof
  desc: "``` opened then EOF, empty body — UnclosedFreeform, no Text"
  udon: "```"
  root_only: true
  # CORE "End of input": frame open, nothing captured ⇒ warning only.
  events:
    - FreeformStart
    - [Warning, "UnclosedFreeform"]
    - FreeformEnd

- id: du_freeform_info_string_no_newline_eof
  desc: "```rust then EOF — info-string text begins the body (no separate info rule)"
  udon: "```rust"
  root_only: true
  # CORE "Triple-Backtick Escape": everything after the backticks begins the
  # body; EOF newline-equivalent ⇒ "rust" is the body's first Text.
  # (A no-newline info string is body content — everything after the
  #  backticks begins the body.)
  events:
    - FreeformStart
    - [Text, "rust"]
    - [Warning, "UnclosedFreeform"]
    - FreeformEnd

- id: du_freeform_sameline_opened_unterminated_eof
  desc: fence opened in sameline scan (after attrs), body, then EOF
  udon: "|a |b :k v ```\nbody"
  root_only: true
  # CORE "Triple-Backtick Escape": a fence may follow elements+attributes in
  # sameline scan; body starts after the backticks. Open at EOF ⇒ warning.
  events:
    - ElementStart
    - [Name, "a"]
    - ElementStart
    - [Name, "b"]
    - [Attr, "k"]
    - [BareValue, "v"]
    - FreeformStart
    - [Text, "body"]
    - [Warning, "UnclosedFreeform"]
    - FreeformEnd
    - ElementEnd
    - ElementEnd


# ===========================================================================
# I. VALUE-POSITION delimited constructs hitting EOF (string / array /
#    envelope as an ATTRIBUTE VALUE). The block-attr string, value array, and
#    value envelope are already in eof_recovery. This adds the sameline-attr
#    string (opener-only) to complete the context matrix, and stacks a
#    string+array cascade not otherwise present in opener-only form.
# ===========================================================================

# (Sameline attr string opener-only == du_str_double_opener_only in section A;
#  the value-position matrix is otherwise covered by eof_recovery + A/B/F.)

- id: du_val_string_in_array_opener_only_eof
  desc: opener-only quoted item inside an unclosed array at EOF
  udon: '|el :xs ["'
  root_only: true
  # CORE "End of input" cascade (cf. eof_unclosed_string_in_unclosed_array,
  # but empty capture): StringValue "" + UnclosedStringValue, then
  # UnclosedArray + ArrayEnd.
  events:
    - ElementStart
    - [Name, "el"]
    - [Attr, "xs"]
    - ArrayStart
    - [StringValue, ""]
    - [Warning, "UnclosedStringValue"]
    - [Warning, "UnclosedArray"]
    - ArrayEnd
    - ElementEnd


