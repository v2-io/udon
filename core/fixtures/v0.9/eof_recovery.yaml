# End-of-input and anomaly recovery (CORE "End of input (EOF)" — the
# Unclosed* table — and "Anomaly posture"). EOF is the universal implicit
# closer: every pending End event flushes, innermost-first, exactly as a
# full dedent would fire them. A construct whose content is already coherent
# closes SILENTLY; a construct still awaiting a DELIMITER closes with its
# captured content plus an Unclosed* anomaly. A missing final newline is
# never, by itself, an anomaly. Nothing is ever discarded at EOF.
#
# Every expectation below is derived from CORE text alone (never traced from
# parser output). Cases are root_only because the harness's wrap/indent
# mutations would insert material after the deliberately-truncated input.

# ---------------------------------------------------------------------------
# Missing final newline is a non-anomaly (CORE "End of input (EOF)": "EOF is
# newline-equivalent everywhere a rule says 'followed by a newline'").
# Indentation-scoped constructs close silently; End events flush.
# ---------------------------------------------------------------------------

- id: eof_element_no_final_newline
  desc: an element with no trailing newline closes silently — no anomaly
  udon: "|div"
  root_only: true
  events:
    - ElementStart
    - [Name, "div"]
    - ElementEnd

- id: eof_nested_elements_flush_innermost_first
  desc: EOF flushes pending ElementEnd events innermost-first, like a full dedent
  udon: "|a\n  |b\n    |c"
  root_only: true
  events:
    - ElementStart
    - [Name, "a"]
    - ElementStart
    - [Name, "b"]
    - ElementStart
    - [Name, "c"]
    - ElementEnd
    - ElementEnd
    - ElementEnd

- id: eof_block_attr_no_final_newline
  desc: a finished block attribute value at EOF is coherent — silent close
  udon: "|el\n  :k v"
  root_only: true
  events:
    - ElementStart
    - [Name, "el"]
    - [Attr, "k"]
    - [BareValue, "v"]
    - ElementEnd

- id: eof_line_comment_no_final_newline
  desc: a line comment at EOF closes silently (CommentEnd flushes)
  udon: "; note"
  root_only: true
  events:
    - CommentStart
    - [Text, " note"]
    - CommentEnd

- id: eof_comment_continuation_closes_silently
  desc: an indentation-continued comment closes silently at EOF
  udon: "|a\n  ; start of comment\n    still part of the comment"
  root_only: true
  events:
    - ElementStart
    - [Name, "a"]
    - CommentStart
    - [Text, " start of comment"]
    - [Text, "still part of the comment"]
    - CommentEnd
    - ElementEnd

- id: eof_directive_closes_silently
  desc: a block directive's pending DirectiveEnd flushes silently at EOF
  udon: "!if logged_in\n  |greeting Welcome"
  root_only: true
  events:
    - DirectiveStart
    - [Name, "if"]
    - [Text, "logged_in"]
    - ElementStart
    - [Name, "greeting"]
    - [Text, "Welcome"]
    - ElementEnd
    - DirectiveEnd

- id: eof_raw_block_closes_silently
  desc: an indentation-scoped raw block closes silently at EOF (no closer to forget)
  udon: "!:sh:\n  echo hi"
  root_only: true
  events:
    - DirectiveStart
    - [Name, "sh"]
    - [Raw, ""]
    - [RawContent, "echo hi"]
    - DirectiveEnd

- id: eof_deferred_attr_value_closes_silently
  desc: a deferred (indentation-scoped) attribute value with body closes silently
  udon: "|el\n  :note\n    line one\n    line two"
  root_only: true
  events:
    - ElementStart
    - [Name, "el"]
    - [Attr, "note"]
    - [Text, "line one"]
    - [Attr, "note"]
    - [Text, "line two"]
    - ElementEnd

- id: eof_fence_closer_no_final_newline
  desc: a fence closer "followed by a newline" accepts EOF as that newline — no anomaly
  udon: "```\nbody\n```"
  root_only: true
  events:
    - FreeformStart
    - [Text, "body"]
    - FreeformEnd

- id: eof_prose_no_final_newline
  desc: prose cut off by EOF mid-word is just the text so far — no anomaly
  udon: "|p hello worl"
  root_only: true
  events:
    - ElementStart
    - [Name, "p"]
    - [Text, "hello worl"]
    - ElementEnd

# ---------------------------------------------------------------------------
# Delimiter-awaiting constructs at EOF: captured content + an Unclosed*
# WARNING (two-level severity — content is kept), then End flushes (CORE
# "End of input"). Anomalies are events in the stream, never exceptions
# (CORE "Anomaly posture").
# ---------------------------------------------------------------------------

- id: eof_unclosed_embedded
  desc: EOF inside |{...} — content so far + UnclosedEmbedded; EmbeddedEnd flushes
  udon: "|p some |{em abc"
  root_only: true
  events:
    - ElementStart
    - [Name, "p"]
    - [Text, "some "]
    - EmbeddedStart
    - [Name, "em"]
    - [Text, "abc"]
    - [Warning, "UnclosedEmbedded"]
    - EmbeddedEnd
    - ElementEnd

# CORE "End of input" (alpha.2): nested delimited constructs yield one
# Unclosed* each, innermost-first — so one UnclosedEmbedded per unclosed |{,
# where each EmbeddedEnd flushes. Each frame answers against its own entry
# site, so the order falls out of the stack unwind (uniform with the single
# case).
- id: eof_unclosed_embedded_nested
  desc: nested unclosed embeds each error, flushing innermost-first
  udon: "|p |{a x |{b y"
  root_only: true
  events:
    - ElementStart
    - [Name, "p"]
    - EmbeddedStart
    - [Name, "a"]
    - [Text, "x "]
    - EmbeddedStart
    - [Name, "b"]
    - [Text, "y"]
    - [Warning, "UnclosedEmbedded"]
    - EmbeddedEnd
    - [Warning, "UnclosedEmbedded"]
    - EmbeddedEnd
    - ElementEnd

- id: eof_unclosed_inline_comment
  desc: EOF inside ;{...} — content so far + UnclosedInlineComment; CommentEnd flushes
  udon: "|p a ;{note"
  root_only: true
  events:
    - ElementStart
    - [Name, "p"]
    - [Text, "a "]
    - CommentStart
    - [Text, "note"]
    - [Warning, "UnclosedInlineComment"]
    - CommentEnd
    - ElementEnd

- id: eof_unclosed_inline_comment_nested_brace
  desc: an unbalanced inner brace leaves the comment awaiting its closer — content so far kept
  udon: "|p a ;{note {inner"
  root_only: true
  events:
    - ElementStart
    - [Name, "p"]
    - [Text, "a "]
    - CommentStart
    - [Text, "note {inner"]
    - [Warning, "UnclosedInlineComment"]
    - CommentEnd
    - ElementEnd

# Innermost-first (CORE "End of input"): the open plain attr resolves first
# (MissingAttributeValue + synthesized Nil, per "Attribute Keys and Flags" —
# a semantic-at-close check), then the embed's UnclosedEmbedded warning and
# EmbeddedEnd flush. Two composed EOF rules; the order is the stack unwind.
- id: eof_unclosed_embedded_with_open_attr
  desc: "⚠ EOF inside |{...} with a valueless plain attr — error+Nil, then UnclosedEmbedded"
  udon: "|p |{a :href"
  root_only: true
  events:
    - ElementStart
    - [Name, "p"]
    - EmbeddedStart
    - [Name, "a"]
    - [Attr, "href"]
    - [Error, "MissingAttributeValue"]
    - Nil
    - [Warning, "UnclosedEmbedded"]
    - EmbeddedEnd
    - ElementEnd

# CORE "End of input": items so far + UnclosedArray, then ArrayEnd flushes.
# arrays.yaml's array_unclosed_warns (newline-ended) has the same shape
# (Warning + ArrayEnd) — for a line-bound array a newline is EOF-equivalent.
- id: eof_unclosed_array
  desc: EOF inside [...] — items so far + UnclosedArray; ArrayEnd flushes
  udon: "|el :xs [1 2"
  root_only: true
  events:
    - ElementStart
    - [Name, "el"]
    - [Attr, "xs"]
    - ArrayStart
    - [Integer, "1"]
    - [Integer, "2"]
    - [Warning, "UnclosedArray"]
    - ArrayEnd
    - ElementEnd

# Nested delimited at EOF (CORE "End of input"): one Unclosed* each,
# innermost-first — each open bracket awaited its `]`, so each warns where
# its ArrayEnd flushes.
- id: eof_unclosed_array_nested
  desc: "nested unclosed arrays each warn, innermost-first"
  udon: "|el :xs [1 [2"
  root_only: true
  events:
    - ElementStart
    - [Name, "el"]
    - [Attr, "xs"]
    - ArrayStart
    - [Integer, "1"]
    - ArrayStart
    - [Integer, "2"]
    - [Warning, "UnclosedArray"]
    - ArrayEnd
    - [Warning, "UnclosedArray"]
    - ArrayEnd
    - ElementEnd

# Cascade (CORE "End of input", innermost-first): the quoted string
# (StringValue + UnclosedStringValue) inside the array (items + UnclosedArray;
# ArrayEnd flushes). Content-then-warning matches the string shape in
# error_cases.yaml.
- id: eof_unclosed_string_in_unclosed_array
  desc: "EOF inside a quoted item inside [...] — both warnings, innermost-first"
  udon: "|el :xs [\"a"
  root_only: true
  events:
    - ElementStart
    - [Name, "el"]
    - [Attr, "xs"]
    - ArrayStart
    - [StringValue, "a"]
    - [Warning, "UnclosedStringValue"]
    - [Warning, "UnclosedArray"]
    - ArrayEnd
    - ElementEnd

# ⚠ Envelope row inside the array row. Warning-before-value order follows the
# envelope convention (typing_envelope.yaml / eof_unclosed_envelope).
- id: eof_unclosed_envelope_in_unclosed_array
  desc: "⚠ EOF inside <...> inside [...] — envelope warning, then the array error"
  udon: "|el :xs [<5m"
  root_only: true
  events:
    - ElementStart
    - [Name, "el"]
    - [Attr, "xs"]
    - ArrayStart
    - [Warning, "UnclosedTypeEnvelope"]
    - [BareValue, "<5m"]
    - [Warning, "UnclosedArray"]
    - ArrayEnd
    - ElementEnd

# ---------------------------------------------------------------------------
# <...> typing envelope: single-line, warning-recovered (CORE "Explicit
# Typing": a newline before the matching > ends the value there — captured
# text passed through as a string + Warning UnclosedTypeEnvelope; same at
# EOF per the EOF table).
# ---------------------------------------------------------------------------

# ⚠ Three readings chosen where CORE is silent on event-level detail:
# (1) payload — "captured text as string" is encoded as the raw lexical
#     capture INCLUDING the opening `<` ("<2026-07"), consistent with the
#     completed-envelope pass-through keeping the full `<...>` form and
#     with keep-everything;
# (2) event kind — BareValue, matching the completed-envelope interim
#     encoding in typing_envelope.yaml;
# (3) no NoDialectsLoaded alongside — the envelope never completed, so no
#     value was offered to dialect dispatch; the single UnclosedTypeEnvelope
#     warning carries the anomaly. Ordering follows the EOF table's
#     "captured content + warning" (content first), whereas completed
#     envelopes put NoDialectsLoaded BEFORE the value — flag if that
#     asymmetry should be unified.
- id: eof_unclosed_envelope
  desc: EOF inside <...> — captured text as string + UnclosedTypeEnvelope warning
  udon: "|el :when <2026-07"
  root_only: true
  events:
    - ElementStart
    - [Name, "el"]
    - [Attr, "when"]
    - [Warning, "UnclosedTypeEnvelope"]
    - [BareValue, "<2026-07"]
    - ElementEnd

- id: envelope_newline_before_close
  desc: envelopes are single-line — a newline before > ends the value with a warning, parse continues
  udon: "|el :when <7:02\nprose after\n"
  root_only: true
  events:
    - ElementStart
    - [Name, "el"]
    - [Attr, "when"]
    - [Warning, "UnclosedTypeEnvelope"]
    - [BareValue, "<7:02"]
    - ElementEnd
    - [Text, "prose after"]

# ---------------------------------------------------------------------------
# Unclosed freeform fence (CORE EOF table: body so far + Warning
# UnclosedFreeform — the body is coherent, the author likely forgot the
# closer; a warning not an error, and FreeformEnd flushes like every End).
# ---------------------------------------------------------------------------

- id: eof_unclosed_freeform
  desc: fence never closed — body kept + UnclosedFreeform warning
  udon: "```\nbody line\nmore body"
  root_only: true
  events:
    - FreeformStart
    - [Text, "body line"]
    - [Text, "more body"]
    - [Warning, "UnclosedFreeform"]
    - FreeformEnd

- id: eof_unclosed_freeform_in_element
  desc: the warning fires and End events still flush out through the parent
  udon: "|code\n  ```\n  x = 1"
  root_only: true
  events:
    - ElementStart
    - [Name, "code"]
    - FreeformStart
    - [Text, "  x = 1"]
    - [Warning, "UnclosedFreeform"]
    - FreeformEnd
    - ElementEnd

# ---------------------------------------------------------------------------
# Still-open plain attribute at EOF (CORE "Attribute Keys and Flags": a plain
# :key with no value material is MissingAttributeValue — a non-halting error
# event, and the attribute is still emitted WITH a Nil value; the stream
# never carries less shape than the source suggested).
# ---------------------------------------------------------------------------

- id: eof_open_attr_missing_value_sameline
  desc: sameline plain attr cut off by EOF with no value — error + synthesized Nil
  udon: "|el :key"
  root_only: true
  events:
    - ElementStart
    - [Name, "el"]
    - [Attr, "key"]
    - [Error, "MissingAttributeValue"]
    - Nil
    - ElementEnd

- id: eof_open_attr_missing_value_block
  desc: block plain attr at EOF with nothing deeper — error + synthesized Nil
  udon: "|el\n  :note"
  root_only: true
  events:
    - ElementStart
    - [Name, "el"]
    - [Attr, "note"]
    - [Error, "MissingAttributeValue"]
    - Nil
    - ElementEnd

# ---------------------------------------------------------------------------
# EOF mid-token is a clean boundary (CORE "The Scan and the Bare-Token
# Boundary": end-of-line — hence EOF — finishes a bare token alone; keywords
# and numbers type normally). Non-anomalies, all.
# ---------------------------------------------------------------------------

- id: eof_mid_bare_token
  desc: a bare value token finished by EOF is a single-token value
  udon: "|el :k valu"
  root_only: true
  events:
    - ElementStart
    - [Name, "el"]
    - [Attr, "k"]
    - [BareValue, "valu"]
    - ElementEnd

- id: eof_mid_number_integer
  desc: an integer finished by EOF types normally
  udon: "|el :n 42"
  root_only: true
  events:
    - ElementStart
    - [Name, "el"]
    - [Attr, "n"]
    - [Integer, "42"]
    - ElementEnd

- id: eof_mid_number_float
  desc: a float finished by EOF types normally
  udon: "|el :n 3.14"
  root_only: true
  events:
    - ElementStart
    - [Name, "el"]
    - [Attr, "n"]
    - [Float, "3.14"]
    - ElementEnd

- id: eof_keyword_alone_types
  desc: a keyword finishing alone at EOF is typed, not a blob
  udon: "|el :flag true"
  root_only: true
  events:
    - ElementStart
    - [Name, "el"]
    - [Attr, "flag"]
    - BoolTrue
    - ElementEnd

- id: eof_flag_key_snaps_true
  desc: a flag key at EOF (nothing in value position) snaps to true — no anomaly
  udon: "|el :ready?"
  root_only: true
  events:
    - ElementStart
    - [Name, "el"]
    - [Attr, "ready?"]
    - BoolTrue
    - ElementEnd

- id: eof_mid_blob
  desc: a text blob cut off by EOF is the text so far — no anomaly
  udon: "|el :note some trailing words"
  root_only: true
  events:
    - ElementStart
    - [Name, "el"]
    - [Attr, "note"]
    - [Text, "some trailing words"]
    - ElementEnd

# ---------------------------------------------------------------------------
# Remaining table rows × contexts: quoted string on a block line,
# interpolation in value position, and newline-equivalence through the
# marker paths (directive, identity, reference, sameline comment) — all
# derived from the same EOF rules as the cases above.
# ---------------------------------------------------------------------------

- id: eof_unclosed_string_block_attr
  desc: an unclosed quoted value on a block attr line — same row, block context
  udon: "|el\n  :k \"unclosed"
  root_only: true
  events:
    - ElementStart
    - [Name, "el"]
    - [Attr, "k"]
    - [StringValue, "unclosed"]
    - [Warning, "UnclosedStringValue"]
    - ElementEnd

- id: eof_unclosed_interpolation_value_position
  desc: EOF inside a whole-value interpolation — captured expression + warning
  udon: "|el :cost !{{price"
  root_only: true
  events:
    - ElementStart
    - [Name, "el"]
    - [Attr, "cost"]
    - [Interpolation, "price"]
    - [Warning, "UnclosedInterpolation"]
    - ElementEnd

# Inline dynamics forms at EOF (single-line): the brace-delimited `!{name …}`
# directive and `!{:kind: …}` raw keep their content and warn with their own
# construct-name codes (descent `|unclosed <Name>` + caller-owns-name; the block
# `!name` / `!:lang:` forms are positional, never "unclosed"). Multi-line
# spanning stays undefined — see fixtures/exploratory/multi-line.yaml.
- id: eof_unclosed_inline_directive
  desc: "EOF inside !{name …} — args kept + UnclosedInlineDirective; DirectiveEnd flushes"
  udon: "|p !{if x"
  root_only: true
  events:
    - ElementStart
    - [Name, "p"]
    - DirectiveStart
    - [Name, "if"]
    - [Text, "x"]
    - [Warning, "UnclosedInlineDirective"]
    - DirectiveEnd
    - ElementEnd

- id: eof_unclosed_inline_raw
  desc: "EOF inside !{:kind: …} — raw body kept + UnclosedInlineRaw; DirectiveEnd flushes"
  udon: "|p !{:json: abc"
  root_only: true
  events:
    - ElementStart
    - [Name, "p"]
    - DirectiveStart
    - [Name, "json"]
    - [Raw, ""]
    - [RawContent, "abc"]
    - [Warning, "UnclosedInlineRaw"]
    - DirectiveEnd
    - ElementEnd

- id: eof_directive_line_no_newline
  desc: a bodiless directive line at EOF closes silently (newline-equivalence)
  udon: "!if x"
  root_only: true
  events:
    - DirectiveStart
    - [Name, "if"]
    - [Text, "x"]
    - DirectiveEnd

- id: eof_full_identity_no_newline
  desc: suffix, key, and trait all desugar normally when EOF ends the line
  udon: "|el?[k].t"
  root_only: true
  events:
    - ElementStart
    - [Name, "el"]
    - [Attr, "$?"]
    - BoolTrue
    - [Attr, "$key"]
    - [BareValue, "k"]
    - [Attr, "$traits"]
    - [BareValue, "t"]
    - ElementEnd

- id: eof_reference_no_newline
  desc: a complete reference at EOF is coherent — no anomaly
  udon: "@[k]"
  root_only: true
  events:
    - [Reference, "[k]"]

- id: eof_sameline_comment_no_newline
  desc: EOL is a valid comment after-boundary, and EOF is newline-equivalent
  udon: "|p hi ; note"
  root_only: true
  events:
    - ElementStart
    - [Name, "p"]
    - [Text, "hi "]
    - CommentStart
    - [Text, " note"]
    - CommentEnd
    - ElementEnd
