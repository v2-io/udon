# ---------------------------------------------------------------------------
# 6. Identity key `[...]` at EOF — DELIMITED, warning `UnclosedIdentityKey`.
#    This is the row CORE's End-of-input rewrite ADDS (TODO-EOF-refactor:
#    "unclosed identity [...] at EOF (delimited; currently silent and absent
#    from the table)"). A NEW anomaly surface -> expected RED.
# ---------------------------------------------------------------------------

# CORE: `|el[k` never closes its identity bracket -> UnclosedIdentityKey. The
# $key attr keeps its value; the warning cites the `[` entry site. There is no
# bracket End event (identity desugars to an attr), so the warning rides at
# the close, before ElementEnd.
- id: eof_unclosed_identity_key_bare
  desc: an unclosed identity `[key` at EOF — value kept + UnclosedIdentityKey
  udon: "|el[k"
  root_only: true
  events:
    - ElementStart
    - [Name, "el"]
    - [Attr, "$key"]
    - [BareValue, "k"]
    - [Warning, "UnclosedIdentityKey"]
    - ElementEnd
  # red?: YES — parser is SILENT (emits $key/BareValue and closes, no warning).
  # New code UnclosedIdentityKey not yet emitted. FLAG: the exact placement of
  # the warning (after the value, before ElementEnd) is my reading; CORE does
  # not yet specify where an identity-key warning sits on the wire, since
  # $key has no bracket End of its own.

# CORE: identity key whose value is an array, both unclosed. Cascade: inner
# array (UnclosedArray+ArrayEnd) then the identity key (UnclosedIdentityKey).
- id: eof_unclosed_identity_key_array_value
  desc: unclosed identity `[[1 2` (array-valued key) at EOF — array + identity warnings
  udon: "|el[[1 2"
  root_only: true
  events:
    - ElementStart
    - [Name, "el"]
    - [Attr, "$key"]
    - ArrayStart
    - [Integer, "1"]
    - [Integer, "2"]
    - [Warning, "UnclosedArray"]
    - ArrayEnd
    - [Warning, "UnclosedIdentityKey"]
    - ElementEnd
