# ============================================================================
# DELIMITED CONSTRUCTS UNCLOSED AT EOF (and, for line-bound ones, at an
# interior newline) — EXHAUSTIVE DRAFT
#
# Slice of the alpha.2 EOF refactor. Governing spec text: CORE.md "End of
# input (EOF)", "Anomaly posture", "Warning codes" (now normative; the design
# record is archived at _archive/TODO-EOF-refactor.md).
#
# THE MODEL (as I derived expectations from):
#   * Every DELIMITED construct (quoted string, [..] array, |{..} embed,
#     ;{..} inline comment, !{{..}} interpolation, <..> envelope, ``` fence,
#     identity [..]) closes ONLY on its printed end-sequence. At EOF a still-
#     open one KEEPS its content-so-far, emits its Unclosed* WARNING (citing
#     where it opened), and flushes its End — innermost-first, one warning
#     per open frame.
#   * Two-level severity (CORE "End of input"): every per-construct Unclosed*
#     is a **Warning** (content kept). The document-level "incomplete input"
#     is a separate *driver result* (non-zero exit / Err), NOT a wire event —
#     so NO fixture below can assert it. See the ⚑ INFRASTRUCTURE flag at the
#     bottom: the two-level ruling is currently un-testable through this
#     fixture format, and the line-bound-on-interior-newline cases (arrays,
#     identity keys) are wire-IDENTICAL to their EOF twins yet differ in the
#     document result. If that distinction is meant to be enforced, the
#     fixture schema needs a `result:`/`incomplete_input:` field.
#
# WHY root_only ON EVERY CASE: inputs are deliberately truncated; the
# harness's wrap/indent variations would append material after the cut point
# (matches eof_recovery.yaml).
#
# Expectations DERIVED FROM CORE, never traced from parser output. I *did*
# run the current parser once per case to fill the `red?:` note honestly
# (parser output NEVER drove an expectation — where parser disagrees with
# CORE I assert CORE and mark red). Event vocabulary + ordering conventions
# lifted from v0.9/eof_recovery.yaml, error_cases.yaml, arrays.yaml,
# typing_envelope.yaml, identity.yaml, freeform.yaml.
#
# KEY FINDINGS surfaced to Joseph (detail inline + in the report):
#   1. EMBEDDED any-phase EOF-drop bug is real and precise: |{..} emits
#      UnclosedEmbedded ONLY once CONTENT has begun. In bare-opener /
#      identity / attr phase the warning is DROPPED. Every such case is RED.
#      (Named in TODO-EOF-refactor "Open work".)
#   2. IDENTITY [..] emits NO Unclosed warning today, in ANY phase — the code
#      UnclosedIdentityKey never fires. Wholly-new consumer surface; every
#      identity-open case is RED.
#   3. (FIXED 2026-07-19) interpolation lone-} — promoted to v0.9/eof_delimited.
#   4. ⚑ MODEL GAP: inline directive !{..} and inline raw !{:kind: ..} are
#      brace-delimited constructs with NO Unclosed* code in the registry.
#      The parser reuses `UnclosedEmbedded` for an unclosed inline directive.
#      See section J.
#   5. ⚑ MODEL AMBIGUITY: quoted strings are NOT in the line-bound list, so a
#      newline inside "..." is captured as content (parser agrees). CORE.md
#      never states this either way. Section A flags it.
# ============================================================================


# ===========================================================================
# A. QUOTED STRINGS  "..."  and  '...'
#    CORE "Strings"; "End of input" (delimited); code UnclosedStringValue.
#    Wire shape (error_cases.yaml / eof_recovery.yaml): [StringValue, <text>]
#    then [Warning, UnclosedStringValue] — NO StringEnd event. Content-first.
#    Strings are NOT in the line-bound set (TODO-EOF-refactor "The cut"), so a
#    newline is ordinary content (see A5 ⚑).
#    Already covered elsewhere: eof_unclosed_string_block_attr (block, EOF),
#    error_cases unclosed_double/single_quote (sameline, EOF). These add the
#    opener-only / empty-capture / newline-inside variations.
# ===========================================================================

# CORE "End of input": content kept "may be nothing beyond the opener itself"
# — so an opener with nothing captured is a StringValue of "" plus the warning.

- id: du_embed_identity_key_open_eof
  desc: "|{a[k — embed AND identity key both open — cascade of two warnings (RED)"
  udon: "|p |{a[k"
  root_only: true
  # CORE: innermost-first — identity key soft-closes (UnclosedIdentityKey,
  # content "k" kept) THEN the embed (UnclosedEmbedded). Two open frames.
  # red?: YES — parser emits neither warning (identity never warns; embed
  # drops in identity phase). Doubly red.
  events:
    - ElementStart
    - [Name, "p"]
    - EmbeddedStart
    - [Name, "a"]
    - [Attr, "$partial-key"]
    - [BareValue, "k"]
    - [Warning, "UnclosedIdentityKey"]
    - [Warning, "UnclosedEmbedded"]
    - EmbeddedEnd
    - ElementEnd

# ;{..} inside a text-blob attribute value (CORE "Text-Blob Values": inline
# forms fire in a blob). Pins the inline comment in VALUE/BLOB position.
- id: du_ic_in_text_blob_eof
  desc: unclosed ;{ inside an attribute text blob at EOF
  udon: "|el\n  :note text ;{c"
  root_only: true
  # CORE "Text-Blob Values": ";{...}" fires inside a blob; CORE "End of input"
  # ⇒ UnclosedInlineComment. Block attr line, so blob owns the tail.
  # red?: unsure (blob segmentation rhythm is "working shape" per CORE Event
  #        Encoding note; assert the comment warning regardless of Text split)
  events:
    - ElementStart
    - [Name, "el"]
    - [Attr, "note"]
    - [Text, "text "]
    - CommentStart
    - [Text, "c"]
    - [Warning, "UnclosedInlineComment"]
    - CommentEnd
    - ElementEnd


# ===========================================================================
# H. IDENTITY BRACKET  [...]   ← THE WHOLLY-NEW SURFACE (all RULED; still RED)
#    CORE "Identity (Keys) and Classification". Code UnclosedIdentityKey —
#    NOT YET emitted by the parser in ANY phase (the hard shared-scanner
#    parse_element_identity gap-2, core/TODO-CORE-PARSING.md). Every case here
#    is RED — the grammar-phase target spec.
#
#    RULED (CHANGELOG alpha.2 §1.3; do not re-open):
#      (a) content captured ( |el[k ) ⇒ the partial value desugars under
#          **`$partial-key`** (NOT `$key` — CORE §302 fail-safe: a consumer
#          reading `$key`/resolving a ref then excludes a truncated identity),
#          kept, + UnclosedIdentityKey. (These fixtures use `$partial-key`.)
#      (b) nothing captured ( |el[ ) ⇒ just the warning, no attr (du_id_opener_only_eof).
#      (c) order: content-then-warning (uniform emission-order ruling).
# ===========================================================================

- id: du_id_opener_only_eof
  desc: "|el[ then EOF, nothing captured — UnclosedIdentityKey, no $key (RED)"
  udon: "|el["
  root_only: true
  # CORE "Identity" + "End of input" (new row: unclosed identity [..] ⇒
  # UnclosedIdentityKey). Nothing captured ⇒ no $key Attr (open (b)).
  # red?: YES — parser emits ElementStart/Name/ElementEnd only, no warning.
  events:
    - ElementStart
    - [Name, "el"]
    - [Warning, "UnclosedIdentityKey"]
    - ElementEnd

- id: du_id_partial_eof
  desc: "|el[k then EOF — $key value \"k\" kept + UnclosedIdentityKey (RED)"
  udon: "|el[k"
  root_only: true
  # CORE: content "k" kept as the $key value; frame open ⇒ UnclosedIdentityKey.
  # red?: YES — parser emits $key/BareValue "k" but NO warning.
  events:
    - ElementStart
    - [Name, "el"]
    - [Attr, "$partial-key"]
    - [BareValue, "k"]
    - [Warning, "UnclosedIdentityKey"]
    - ElementEnd

- id: du_id_newline_closes_rest_is_prose
  desc: "|el[k then newline — line-bound soft close + UnclosedIdentityKey; rest is prose (RED)"
  udon: "|el[k\nmore"
  root_only: true
  # CORE/TODO-EOF-refactor "Line-bound delimited": newline ≡ EOF for identity
  # [..]; UnclosedIdentityKey at the newline; "more" parses as prose child.
  # red?: YES — parser closes and treats "more" as prose (right) but omits the
  #        warning (⚑ document result here is SUCCESS vs non-success for the
  #        EOF twin — see infra flag).
  events:
    - ElementStart
    - [Name, "el"]
    - [Attr, "$partial-key"]
    - [BareValue, "k"]
    - [Warning, "UnclosedIdentityKey"]
    - [Text, "more"]
    - ElementEnd

- id: du_id_anonymous_eof
  desc: "|[k then EOF — anonymous element, unclosed identity key (RED)"
  udon: "|[k"
  root_only: true
  # CORE "Anonymous Elements": name optional; identity sugar unchanged. Frame
  # open ⇒ UnclosedIdentityKey.
  # red?: YES — parser emits $key/"k", no warning.
  events:
    - ElementStart
    - [Attr, "$partial-key"]
    - [BareValue, "k"]
    - [Warning, "UnclosedIdentityKey"]
    - ElementEnd

- id: du_id_string_key_open_eof
  desc: "|el[\"abc then EOF — unclosed string INSIDE unclosed identity key (RED cascade)"
  udon: "|el[\"abc"
  root_only: true
  # CORE "Identity" ("[key] follows normal attribute-value rules"): a quoted
  # key value. Innermost-first: UnclosedStringValue (content "abc") then
  # UnclosedIdentityKey.
  # red?: YES — parser warns UnclosedStringValue (inner) but drops
  #        UnclosedIdentityKey (outer). Half-red — exposes the cascade gap.
  events:
    - ElementStart
    - [Name, "el"]
    - [Attr, "$partial-key"]
    - [StringValue, "abc"]
    - [Warning, "UnclosedStringValue"]
    - [Warning, "UnclosedIdentityKey"]
    - ElementEnd

- id: du_id_tuple_array_open_eof
  desc: "|el[[1 2 then EOF — unclosed array (tuple key) inside unclosed identity (RED cascade)"
  udon: "|el[[1 2"
  root_only: true
  # CORE "Identity" (key_typed_array_tuple: [[..]] is a composite key) +
  # "End of input". Innermost-first: UnclosedArray + ArrayEnd, then
  # UnclosedIdentityKey. Two DIFFERENT bracket kinds nested.
  # red?: YES — parser warns UnclosedArray (inner) but drops UnclosedIdentityKey.
  events:
    - ElementStart
    - [Name, "el"]
    - [Attr, "$partial-key"]
    - ArrayStart
    - [Integer, "1"]
    - [Integer, "2"]
    - [Warning, "UnclosedArray"]
    - ArrayEnd
    - [Warning, "UnclosedIdentityKey"]
    - ElementEnd

- id: du_id_envelope_key_open_eof
  desc: "|el[<u64 then EOF — unclosed envelope inside unclosed identity key (RED cascade)"
  udon: "|el[<u64"
  root_only: true
  # CORE "Identity" + "Explicit Typing" (envelope opens in value position, and
  # a key IS value position). Innermost-first: UnclosedTypeEnvelope + "<u64",
  # then UnclosedIdentityKey.
  # red?: YES — parser warns UnclosedTypeEnvelope but drops UnclosedIdentityKey.
  events:
    - ElementStart
    - [Name, "el"]
    - [Attr, "$partial-key"]
    - [BareValue, "<u64"]
    - [Warning, "UnclosedTypeEnvelope"]
    - [Warning, "UnclosedIdentityKey"]
    - ElementEnd

- id: du_id_in_embedded_eof
  desc: "|{ref[k then EOF — identity key open inside embed inside prose (RED double cascade)"
  udon: "|p |{ref[k"
  root_only: true
  # CORE "Inline Elements" (identity rules identical inside |{..}) + "End of
  # input". Innermost-first: UnclosedIdentityKey (content "k"), then
  # UnclosedEmbedded (embed in identity phase).
  # red?: YES — parser emits neither warning (identity never warns; embed
  #        drops in identity phase). Doubly red.
  events:
    - ElementStart
    - [Name, "p"]
    - EmbeddedStart
    - [Name, "ref"]
    - [Attr, "$partial-key"]
    - [BareValue, "k"]
    - [Warning, "UnclosedIdentityKey"]
    - [Warning, "UnclosedEmbedded"]
    - EmbeddedEnd
    - ElementEnd
