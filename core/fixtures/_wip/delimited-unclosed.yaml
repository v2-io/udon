# ============================================================================
# _wip — the LAST alpha.2 grammar red: `;{` in a text blob.
#
# RULED 2026-07-19 (CHANGELOG alpha.2): `;{` never ends value capture — it
# continues the blob and reduces to "" (part of the general *{-reduce-to-text
# ruling). This case is the accurate target spec; the grammar work (boundary
# `;`+`{` commit, value_start blob entry, brace-swallow + warning path) is
# tracked in core/TODO-CORE-PARSING.md, folded into the *{ boundary rewrite.
# The identity-key family and every other harvest case promoted to v0.9/
# (2026-07-19; see FINDINGS.md).
# ============================================================================

# ;{..} inside a text-blob attribute value (CORE "Text-Blob Values": inline
# forms fire in a blob). Pins the inline comment in VALUE/BLOB position.
- id: du_ic_in_text_blob_eof
  desc: unclosed ;{ inside an attribute text blob at EOF
  udon: "|el\n  :note text ;{c"
  root_only: true
  # CORE "Text-Blob Values": ";{...}" fires inside a blob; CORE "End of input"
  # ⇒ UnclosedInlineComment. Block attr line, so blob owns the tail.
  # red?: unsure (blob segmentation rhythm is "working shape" per CORE Event
  #        Encoding note; assert the comment warning regardless of Text split)
  events:
    - ElementStart
    - [Name, "el"]
    - [Attr, "note"]
    - [Text, "text "]
    - CommentStart
    - [Text, "c"]
    - [Warning, "UnclosedInlineComment"]
    - CommentEnd
    - ElementEnd
