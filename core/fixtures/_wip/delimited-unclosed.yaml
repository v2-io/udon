# J3. REFERENCE SELECTOR BRACKET  @el[k
#     CORE "References (@)": a reference is a selector tuple (element, key,
#     traits) — the [key] there uses the same bracket. On "@el[k"<EOF> the
#     parser captures the WHOLE lexeme "el[k" into one Reference event (the
#     unclosed [ is swallowed into the selector, no warning). Is an unclosed
#     reference-key meant to warn (UnclosedIdentityKey? a reference-specific
#     code?) or is a reference's bracket deliberately lax (references are inert
#     at core)? The brief did not list references as delimited; flagging as an
#     adjacent question.
- id: du_gap_reference_bracket_unclosed_eof
  desc: "⚑ MODEL QUESTION: unclosed [ inside a @reference selector — warn, or lax?"
  udon: "@el[k"
  root_only: true
  # No spec-blessed expectation; parser swallows "el[k" as the Reference.
  events: []
