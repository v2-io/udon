# WIP fixtures — alpha.2 EOF model — SLICE: positional-silent closes +
# the bare-marker family. Lives in _wip/ (sibling of v0.9/), so the harness
# does NOT run these; Joseph verifies + merges into v0.9/.
#
# Design of record: spec/TODO-EOF-refactor.md. Governing CORE sections:
# "End of input (EOF)", "Anomaly posture", "Warning codes", "Marker
# Recognition", "Head Position", "Escape (\)", "Attributes", "Hierarchy".
#
# METHOD (per brief): every `events:` block is derived from CORE text, NEVER
# from parser output. The parser was run ONLY to confirm current red/green
# and to find the green `\n`-terminated twin that proves the CORE-mandated
# output (EOF is newline-equivalent, so whatever the `\n` twin already emits
# is what the EOF case must emit). `# red?:` records whether the CURRENT
# parser diverges from the expectation (RED = a real gap = a SUCCESS here).
#
# Every case is root_only: the deliberately-truncated (no trailing newline)
# input would have material appended by the harness's wrap/indent mutations.
#
# ===========================================================================
#  KEY FINDING (the shape of the whole bug)
# ===========================================================================
# The bare-marker-at-EOF bug is EOF-specific and total: when a head-position
# guard is left pending at the FINAL byte (no trailing newline), the current
# parser DROPS the content — 0 events, or a whole element silently vanishing.
# Every red below has a green `\n`-terminated twin that already emits the
# correct events. So CORE + newline-equivalence + the existing green twin
# together PROVE the expectation; the parser simply fails to reach it at true
# EOF. (Confirmed twins: `|\n`->Text"|", `!\n`->Text"!", `|el :\n`->…Text":",
# `|el @\n`->…Text"@", `\|`<EOF>->Text"|" — all green; the no-newline forms
# below are the reds.)
#
# Area 1 (positional-silent closes) is ALREADY GREEN in the running parser —
# elements, directives, raw blocks, deferred attrs, and deep nested stacks
# all flush their Ends silently at EOF today. The value in Section A is
# exhaustive/newline-equivalence coverage, not new reds. All the reds are in
# Section B/C (the bare-marker + escape-at-EOF family).


# ===========================================================================
#  SECTION A — Positional constructs close SILENTLY at EOF (area 1)
#  CORE "End of input": a positional construct closes by its ordinary end
#  rule, silently; EOF is newline-equivalent; a missing final newline is
#  never, by itself, an anomaly. End events flush innermost-first (like a
#  full dedent). These are mostly GREEN — included for exhaustiveness and to
#  pin newline-equivalence with explicit twins.
# ===========================================================================

# --- Deep dedent-at-EOF: one EOF pops the whole stack, innermost-first ---

# --- THE HEADLINE MODEL GAP: !{ at EOF ------------------------------------
# See the "CORE MODEL GAPS" block at the bottom. Short version: after `!`'s
# head guard fails on `{`, the line commits to prose, and in prose `!{` is
# the inline-directive opener (CORE "Unified Inline Syntax"; DYNAMICS: 2nd
# char after `!{` != `{`/`:` => directive). An inline directive is DELIMITED
# (brace-balanced, closes on `}`), so at EOF it is UNCLOSED. But CORE's
# Warning-codes registry has NO unclosed-inline-directive code, and whether a
# NAMELESS inline directive is even legal is unspecified. Two defensible
# readings; I encode the "unclosed delimited construct" reading and flag the
# missing code as UnclosedInlineDirective (working name — DOES NOT EXIST YET).
- id: bang_brace_eof
  desc: "!{ at EOF — inline-directive opener, unclosed (MODEL GAP: no warning code exists)"
  # CORE: "Marker Recognition" (`!{` is a prose-level inline form, not a block
  # directive) + "Unified Inline Syntax" + DYNAMICS disambiguation. Delimited
  # => "End of input" unclosed-warning rule applies. BUT the code is
  # undefined, and a nameless directive's shape is undefined.
  # ALT reading: treat `!{`<EOF> as literal prose Text "!{" (if a bare opener
  # with no name/body is not recognized). Joseph to rule.
  # red?: YES (parser emits 0 events either way — a keep-everything drop).
  udon: "!{"
  root_only: true
  events:
    - DirectiveStart
    - [Warning, "UnclosedInlineDirective"]   # <-- WORKING NAME; code missing from CORE
    - DirectiveEnd

- id: bang_brace_name_eof
  desc: "!{inc at EOF — named inline directive, unclosed (MODEL GAP: no warning code)"
  # CORE: same as bang_brace_eof but with a directive name, so the anonymous
  # question is moot — the only gap is the missing unclosed code. The parser
  # DOES recognize the inline directive (emits DirectiveStart / Name inc /
  # DirectiveEnd) but drops the unclosed warning.
  # red?: YES — missing the UnclosedInlineDirective warning.
  udon: "!{inc"
  root_only: true
  events:
    - DirectiveStart
    - [Name, "inc"]
    - [Warning, "UnclosedInlineDirective"]   # <-- WORKING NAME; code missing from CORE
    - DirectiveEnd
