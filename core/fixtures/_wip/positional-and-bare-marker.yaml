#
# ---------------------------------------------------------------------------
#  Coverage gaps in v0.9/ (no fixture exists, in or adjacent to this slice)
# ---------------------------------------------------------------------------
# a. markers.yaml has bare_pipe_is_prose (`|\n`) and bare_bang_is_prose
#    (`!\n`) but NO bare `@\n` (`bare_at_is_prose`) and NO bare `;` case.
#    Their EOF twins are covered above (bare_at_eof, bare_semicolon_eof);
