# ===========================================================================
#  CORE MODEL GAPS — flag LOUDEST (spec is ambiguous or silent)
#  These are the highest-value finds: places where the fixture reads as
#  "non-compliant" but the real problem is CORE itself. All -> TODO-SPEC-CORE.
# ===========================================================================
#
# GAP 1 (HEADLINE) — Unclosed INLINE DIRECTIVE has no warning code, and a
#   nameless inline directive is unspecified.
#   * `!{...}` is a DELIMITED prose-level inline form (closes on `}`; CORE
#     "Unified Inline Syntax", DYNAMICS). By "End of input" two-level
#     severity, an open `!{name` at true EOF must keep its content and emit an
#     `Unclosed*` WARNING citing its entry site. But the Warning-codes
#     registry lists UnclosedEmbedded / UnclosedInlineComment /
#     UnclosedInterpolation / … and NO unclosed-inline-directive code. There
#     is a code-shaped hole. (Working name used above: UnclosedInlineDirective.)
#   * Separately: `!{`<EOF> with no name — is a NAMELESS inline directive
#     legal? Block directives require a name ("!name ..."). Embedded elements
#     may be anonymous, but directives' anonymity is unstated. If illegal,
#     `!{`<EOF> should perhaps fall to literal prose Text "!{" instead.
#   * This also corrects an ASSUMPTION in the brief: "!{ resolves as it would
#     at a newline (mostly prose)." It does NOT — `!{` is delimited and
#     brace-balanced, so a NEWLINE does not close it (multi-line inline
#     directive, like `|{...}`); it stays open and only EOF makes it unclosed.
#     So `!{`<EOF> is a delimited-unclosed case, not a bare-marker-to-prose
#     case. (Contrast the truly-bare `|`/`@`/`!`/`:`, whose guards fail and
#     which DO drop to prose.)
#
# GAP 2 — Empty-value via value-position `\` at EOF (value_escape_empty_eof).
#   CORE says the `\` enters text mode and "makes the value a text blob," but
#   is silent on an EMPTY blob. Satisfied value (Text "") or re-triggered
#   MissingAttributeValue? Needs a ruling. (Same question for `|el :count \n`
#   with the `\` then immediate newline — is the deferred body then required?)
#
# GAP 3 — Root-level attribute with no owning element.
#   `:x`<EOF> at the document root currently emits a FREE-FLOATING
#   Attr "x" / Error MissingAttributeValue / Nil — an attribute with no
#   ElementStart to attach to. CORE "Marker Recognition" says `:` is an
#   attribute "while the element has no child content yet," but at ROOT there
#   is no element at all. What does a root-initial `:key` mean? (Prose? An
#   attribute of an implicit root? An error?) Note the asymmetry this creates:
#   `:`<EOF> (no name) -> prose ":"; `:x`<EOF> (name) -> a root attribute.
#   Not fixtured above (has a name, so outside the strict final-byte family),
#   but a real CORE silence worth ruling. -> TODO-SPEC-CORE.
#
# GAP 4 — Empty positional tail: emit an empty Text or nothing?
#   `;`<EOF> (empty comment) and `\`<EOF> (empty forced-prose tail) raise the
#   same question and the parser answers them INCONSISTENTLY (see audit #5).
#   CORE should state whether an empty positional body emits a zero-length
#   Text/segment event or no event, uniformly. -> TODO-SPEC-CORE.
