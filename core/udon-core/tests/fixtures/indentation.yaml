# Indentation and nesting tests

- id: child_by_indent
  desc: Child element via indentation
  udon: "|parent\n  |child\n"
  events:
    - ElementStart
    - [Name, "parent"]
    - ElementStart
    - [Name, "child"]
    - ElementEnd
    - ElementEnd

- id: sibling_by_same_indent
  desc: Siblings at same indentation level
  udon: "|parent\n  |child1\n  |child2\n"
  events:
    - ElementStart
    - [Name, "parent"]
    - ElementStart
    - [Name, "child1"]
    - ElementEnd
    - ElementStart
    - [Name, "child2"]
    - ElementEnd
    - ElementEnd

- id: dedent_closes_multiple
  desc: Dedent closes multiple open elements
  udon: "|a\n  |b\n    |c\n|d\n"
  events:
    - ElementStart
    - [Name, "a"]
    - ElementStart
    - [Name, "b"]
    - ElementStart
    - [Name, "c"]
    - ElementEnd
    - ElementEnd
    - ElementEnd
    - ElementStart
    - [Name, "d"]
    - ElementEnd

- id: block_attributes
  desc: Attributes on indented lines
  udon: "|div\n  :title Hello\n  :author Joseph\n"
  events:
    - ElementStart
    - [Name, "div"]
    - [Attr, "title"]
    - [BareValue, "Hello"]
    - [Attr, "author"]
    - [BareValue, "Joseph"]
    - ElementEnd

- id: deeply_nested
  desc: Three levels of nesting
  udon: "|a\n  |b\n    |c\n      |d\n"
  events:
    - ElementStart
    - [Name, "a"]
    - ElementStart
    - [Name, "b"]
    - ElementStart
    - [Name, "c"]
    - ElementStart
    - [Name, "d"]
    - ElementEnd
    - ElementEnd
    - ElementEnd
    - ElementEnd

# Defect #6 (REVIEW-JULY-2026 §4): columns count characters, not bytes.
# 'é' is 2 bytes / 1 char; with byte-counted columns the sameline child |b
# sits one column further right than it visually does, so "      c"
# (6 spaces) would dedent out of it. Char-correct columns make c a child
# of b, matching the ASCII-name control below.

- id: multibyte_name_column_tracking
  desc: Sameline child element after multibyte chars gets char-correct column
  udon: "|aé |b\n      c\n"
  events:
    - ElementStart
    - [Name, "aé"]
    - ElementStart
    - [Name, "b"]
    - [Text, "c"]
    - ElementEnd
    - ElementEnd

- id: ascii_name_column_tracking_control
  desc: ASCII control for multibyte_name_column_tracking (same shape)
  udon: "|aX |b\n      c\n"
  events:
    - ElementStart
    - [Name, "aX"]
    - ElementStart
    - [Name, "b"]
    - [Text, "c"]
    - ElementEnd
    - ElementEnd
