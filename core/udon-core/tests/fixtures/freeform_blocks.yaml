---
# Freeform block tests - triple backticks create raw/literal blocks
# Freeform preserves exact whitespace, no dedentation
# Content is emitted as Text events, line by line

- id: basic_freeform_block
  desc: Basic freeform block at document root
  udon: "```\nfreeform content\n```"
  events:
    - FreeformStart
    - [Text, "freeform content"]
    - FreeformEnd

# Freeform preserves special characters - not interpreted
- id: freeform_preserves_pipes
  desc: Pipes in freeform are not interpreted as elements
  udon: "```\n|not-an-element\n|another\n```"
  events:
    - FreeformStart
    - [Text, "|not-an-element"]
    - [Text, "|another"]
    - FreeformEnd

# Freeform blocks work inside elements too
- id: freeform_inside_element
  desc: Freeform inside element preserves content
  udon: "|code\n  ```\n  raw content\n  ```\n"
  events:
    - ElementStart
    - [Name, "code"]
    - FreeformStart
    - [Text, "  raw content"]
    - FreeformEnd
    - ElementEnd

- id: unclosed_freeform_error
  desc: Unclosed freeform produces error at EOF (content preserved)
  udon: "```\nunclosed"
  events:
    - FreeformStart
    - [Text, "unclosed"]
    - [Error, "UnclosedFreeform"]

# Defect #15 (REVIEW-JULY-2026 §4): freeform preserves blank lines exactly.
# A blank line is a BlankLine event; a whitespace-only line is content
# (Text) — exact preservation is freeform's whole contract.

- id: freeform_blank_line_preserved
  desc: Blank line inside freeform emits BlankLine (round-trip contract)
  udon: "```\na\n\nb\n```"
  events:
    - FreeformStart
    - [Text, "a"]
    - BlankLine
    - [Text, "b"]
    - FreeformEnd

- id: freeform_multiple_blank_lines_preserved
  desc: Consecutive blank lines inside freeform each emit BlankLine
  udon: "```\na\n\n\nb\n```"
  events:
    - FreeformStart
    - [Text, "a"]
    - BlankLine
    - BlankLine
    - [Text, "b"]
    - FreeformEnd

- id: freeform_whitespace_only_line_preserved
  desc: Whitespace-only line inside freeform is exact content, not merged
  udon: "```\na\n   \nb\n```"
  events:
    - FreeformStart
    - [Text, "a"]
    - [Text, "   "]
    - [Text, "b"]
    - FreeformEnd

- id: freeform_leading_blank_line
  desc: Freeform starting with a blank line preserves it
  udon: "```\n\na\n```"
  events:
    - FreeformStart
    - BlankLine
    - [Text, "a"]
    - FreeformEnd
