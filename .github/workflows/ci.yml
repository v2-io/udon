# UDON umbrella CI — build, full conformance, and the regeneration DRIFT GATE.
#
# The drift gate is the mechanical form of the spec-impl sync discipline
# (REVIEW §7-B): parser.rs and parser_pd.rs must always equal what the pinned
# generator produces from the committed grammar units
# (generator/NN-udon.*.descent.udon). A red gate means someone hand-edited
# generated code, or changed a grammar without regenerating, or the descent
# pin moved without a regen — the exact silent-divergence failure mode the
# July 2026 review §2 genealogy documents.

name: ci
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test-and-drift-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true # tools/descent needed for the drift gate
                            # (_archive/udon-ruby is update=none — not fetched)

      - uses: dtolnay/rust-toolchain@stable

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            core/target
          key: cargo-${{ runner.os }}-${{ hashFiles('core/Cargo.toml') }}

      - name: Build + full test suite (fixtures are default-on)
        working-directory: core
        run: cargo test --workspace

      - name: Drift gate (descent-rs) — both generated backends
        # regenerate-parser is descent-rs-only now (the Ruby overlap cycle
        # retired with the toolchain); it emits parser.rs AND parser_pd.rs,
        # so the gate diffs both.
        run: |
          cd core && ./regenerate-parser --no-build
          cd .. && git diff --exit-code core/udon-core/src/parser.rs core/udon-core/src/parser_pd.rs \
            || { echo '::error::generated parsers drifted from the committed grammars'; exit 1; }
