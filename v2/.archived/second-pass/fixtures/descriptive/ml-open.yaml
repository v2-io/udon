- id: ml_str_newline_inside_unclosed
  profile: descriptive
  open: ML
  desc: "newline inside \"...\" at EOF — multi-line policy unfrozen (R3)"
  udon: "|el :k \"abc\ndef"
  result: incomplete-input
  root_only: true
  notes: >
    0.9 descriptive pin spanned newline as content. 0.10 must not treat this
    as comprehensive law until OPEN ML closes. When closed, reclassify to
    comprehensive with explicit line-bound vs multi-line expectation.

