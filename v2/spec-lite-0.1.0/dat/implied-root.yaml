# [[fixture:implied-root]]: the cases for [[rule:implied-root]].
# An example, proposed from the SOP side on 2026-09-30. Lite's cases are the
# udon team's to adopt, change, or discard.
#
# SHAPE. A fixture file is one record of kind `fixture`
# ([[sop/conv:fixtures]], [[sop/decision:fixture-file-shape]]). It is a YAML mapping: the record's own fields
# come first, as frontmatter does in a Markdown record, and the cases follow
# under `cases:`.
#
# Record fields
#   kind               always `fixture`
#   awaiting-second    the three flags, as on every record
#   awaiting-decision  ([[sop/conv:record-flags]])
#   needs-work
#   depends            the rules these cases were derived from, as kind:slug;
#                      when one changes, the cases are due for a re-read
#   notes              working notes for the file as a whole
#   cases              the cases
#
# Case fields
#   id         a stable name, never reused, even when the profile changes. It
#              is the anchor prose uses to transclude the case:
#              ![[dat/implied-root.yaml#<id>]]
#   profile    canonical    normative: a conforming parser produces this tree
#              idiomatic    normative, and written to teach typical usage
#              counter      normative: a misguided or surprising spelling, with
#                           what a reader expects beside what lite does
#              descriptive  never gates: the readings an open question leaves
#              (defined in [[sop/def:fixture-profiles]])
#   exercises  slugs of the rules the case pins
#   per        slugs of the decisions its tree depends on. It sits on each case
#              rather than on the record, because cases rest on different
#              decisions, and a descriptive case gains one when it flips.
#   open       descriptive only: the questions, by pre-design number, whose
#              closing would make the case normative
#   udon       the input, byte for byte. `|2` sets the block's indentation
#              where the input's first line starts with spaces.
#   tree       normative only: the expected tree, in the text notation of
#              .int/pre-design/README.md (a machine transcript waits on 86)
#   anomalies  normative only: [] when none, else "severity: what, where"
#   expects    counter only: what a reader plausibly expects instead
#   readings   descriptive only: one tree per open alternative, keyed
#              <question>-Q<n>-<option>, e.g. 04-Q2-A
#   why        optional: why the case exists, when that isn't obvious; the
#              kept form of such a note
#              ([[sop/decision:notes-disposition-at-freeze]])
#   notes      optional: working notes for this one case
#
# Where a tree would need an open question's answer, the case is descriptive.

kind: fixture
awaiting-second: true
awaiting-decision: false
needs-work: false
depends: [rule:implied-root]

notes:
  - >-
    Every case's `per` names `implied-root`, a seeded decision with no ADR
    yet (its rendering is in .old/vsect-init/DECISIONS.md). Those entries
    dangle until the udon team converts it. Nothing about this file itself
    waits on a decision, so awaiting-decision is false; the dependency is
    derived from `per`.
  - >-
    No verification-level is written. The fixture ladder's first rung,
    derived-from-rule, can be written by whoever checks these cases against
    the rule once both are committed, with the hash of the rule text they
    were checked against.

cases:
  - id: root_single_top_level_element
    profile: canonical
    exercises: [implied-root]
    per: [implied-root]
    why: >-
      The one-element input gives this tree under every answer to 84 Q1, so
      it can gate the rule while root_two_top_level_elements cannot.
    udon: |
      |person
    tree: |
      document
      └ element person
    anomalies: []

  - id: root_is_never_spelled
    profile: counter
    exercises: [implied-root]
    per: [implied-root]
    why: >-
      It catches a converter that treats a file's one top-level element as
      its root, as vivarium's <name>.<root-element-type>.udon convention
      does (.int/pre-design/70-survey-index.md §04).
    udon: |
      |document
        |section
    expects: >-
      The |document element is the root, with section as its top-level
      child, as XML reads a document's first element.
    tree: |
      document
      └ element document
          └ element section
    anomalies: []

  - id: root_two_top_level_elements
    profile: descriptive
    exercises: [implied-root]
    per: [implied-root]
    open: ["84 Q1"]
    udon: |
      |person
      |person
    readings:
      84-Q1-A: |
        document
        ├ element person
        └ element person
      84-Q1-B: |
        document
        ├ element person
        └ element person
      84-Q1-C: |
        document 1
        └ element person
        document 2
        └ element person

  - id: root_top_level_label
    profile: descriptive
    exercises: [implied-root]
    per: [implied-root]
    open: ["04 Q2"]
    udon: |
      :title My Notes
      |section
    readings:
      04-Q2-A: |
        document
        ├ text ":title My Notes\n"        ; anomaly: warning, top-level attribute
        └ element section
      04-Q2-B: |
        document
            title "My Notes"
        └ element section

  - id: root_indented_top_level_text
    profile: descriptive
    exercises: [implied-root]
    per: [implied-root]
    open: ["04 Q1"]
    udon: |2
        indented first line
      back to zero
    readings:
      04-Q1-A: |
        document
        ├ text "indented first line\n"
        └ text "back to zero\n"           ; anomaly: warning, re-based
      04-Q1-B: |
        document
        └ text "  indented first line\nback to zero\n"
      04-Q1-C: |
        document
        └ text "indented first line\nback to zero\n"

  - id: root_empty_input
    profile: descriptive
    exercises: [implied-root]
    per: [implied-root]
    open: ["89"]
    udon: ""
    readings:
      root-no-children: |
        document
      not-a-document: "no tree; whether that is an error, and what it reports, is open"
    notes:
      - >-
        No pre-design question lists empty input yet. 89 covers empty and
        degenerate forms, but not the empty file. So these readings are keyed
        by what they say, not by question and option, and `open` names 89 as
        the nearest home. Rekey them when the form has a question.
      - >-
        Under 84 Q1 option C, empty input would hold zero documents: the
        second reading, without an error.
