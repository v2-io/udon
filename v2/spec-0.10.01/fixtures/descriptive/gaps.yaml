# 0.10.1-draft fixtures — DESCRIPTIVE: places the text does not settle.
# NOT gate material. Each case names the audit item it probes (`gap:`), shows the
# readings the text licenses, and pins nothing. When a ruling lands, the case
# moves to comprehensive with a single `adm` or is deleted.
# Audit: ../../working-notes/AUDIT-2026-09-01.md

# ------------------------------------------------- A1 block capture as a value

- id: gap_A1_block_capture_as_assignment_value_sameline
  profile: descriptive
  gap: A1
  desc: "<kind: at a value-expected position: value form (spans to a >) or block form (geometric)?"
  udon: |
    |el :code <python:
      if a > b:
        pass
    |next
  readings:
    value_form: "capture value kind python, body 'if a ' — closes at the > in the code; then $main 'b:' … and |next becomes … (the rest is a mess); §3 clause 1 + §6.4 self-announcing"
    block_form: "capture block kind python, body 'if a > b:\\n  pass\\n'; |next a sibling; §3 clause 2 (Structure Position + ident:)"
  notes: "0.10.0 spelled this |el :code !:python: (§10.1 'uniformly in node-value position'); the draft has no unambiguous spelling for it"

- id: gap_A1_block_capture_as_deferred_body_first_line
  profile: descriptive
  gap: A1
  desc: "a deferred body's first line carries the value-expected position (§6.5) — so <kind: there is again the value form?"
  udon: |
    |el
      :code
        <python:
          print(1)
  readings:
    value_form: "unclosed value capture → spans to EOF → incomplete-input (body 'python:\\n  print(1)\\n'?)"
    block_form: "capture block kind python body 'print(1)\\n', complete"

- id: gap_A1_block_capture_line_start_with_closer_on_line
  profile: descriptive
  gap: A1
  desc: "<python:foo> on its own line at Structure Position (no value expected): block with tail 'foo>' or value capture as a … node?"
  udon: |
    |el
      <python:foo>
  readings:
    block_form: "block capture kind python, same-line tail body 'foo>'"
    value_form: "a value capture standing as a child node — no such Node kind in MODEL §2 (Capture is listed, geometry value?)"

# ------------------------------------------- A2 lists span: accident containment

- id: gap_A2_list_forgotten_closer_swallows_document
  profile: descriptive
  gap: A2
  desc: "a forgotten ] under DELTAS 12: the list runs to EOF (incomplete-input) — every later line becomes items"
  deltas: 12
  udon: |
    |post :tags [a b
      :title Hello
    |next :x 1
  readings:
    spans: "xs = [a b :title Hello |next :x 1]?? — what are ':title' and '|next' as list items (§10.4 forbids multi-word text; §9.2 puts block forms nowhere a list item can be) — and result incomplete-input"
    failsafe: "the identity-bracket rule applied by analogy: close at EOL, Warning, partial list kept — the 0.10.0 behavior"
  notes: "§11.2's admission rule ('accident-containment reason') is satisfied here exactly as for |el[k; the draft gives no reason lists differ"

- id: gap_A2_block_form_marker_inside_spanning_list
  profile: descriptive
  gap: A2
  desc: "a block-form marker inside a multi-line list: item? terminator? warning?"
  udon: |
    |el :xs [1
      |other :a 1
      2]
  readings:
    text_item: "items 1, '|other', ':a', 1, 2 — block forms demoted to bare tokens, silently?"
    terminator: "the list closes (fail-safe-ish) at the block-form marker with a Warning; |other is a child"
    unspecified: "nothing in §10.4/§9.2/§10.5 addresses it"

# ------------------------------------ A3 trait-continue vs cardinality suffix

- id: gap_A3_trait_question_vs_cardinality
  profile: descriptive
  gap: A3
  desc: "@user.admin? — trait 'admin?' with {1,1}, or trait 'admin' with {0,1}? (the draft's own §9.2 example inside braces)"
  deltas: 6
  udon: |
    |r
      @user.admin?
      @user.admin*
  readings:
    trait_wins: "traits ['admin?'] card [1,1]; traits ['admin*'] card [1,1] — §5.3 trait-continue includes ? ! * +"
    cardinality_wins: "traits ['admin'] card [0,1]; ['admin'] card [0,N] — §9.1 trailing suffix"

- id: gap_A3_dot_path_vs_trait
  profile: descriptive
  gap: A3
  desc: "bare @post.title is selector-subset (trait 'title'); @{post.title} is a raw head (an attribute path per the draft's examples). Are they the same reference?"
  udon: |
    |r
      @post.title
      @{post.title}
  readings:
    different: "head {name: post, traits: [title]} vs head {raw: 'post.title'} — SEMANTICS 1 compares by head; they differ"
    same: "the addressing theory's grammar reads both as a path; the selector subset is only 'this version's' recognizer"

# ---------------------------------------------------- A4 $main value vs child

- id: gap_A4_block_form_at_main_slot
  profile: descriptive
  gap: A4
  desc: "|a |b — b is a sameline child (§2.2) or the $main value of a (§6.4/§6.5/§6.10)?"
  udon: "|a |b :n 1\n"
  readings:
    child: "a { content: [ b {n:1} ] } — §2.2 sameline nesting; spelling-grid Element row"
    main_value: "a { assignments: [$main = node b {n:1}] } — §6.4 block-form node self-announces, §6.5 stacks as $main"
  notes: "SEMANTICS 5 makes :x |em hi ≡ :x |{em hi}; under the $main reading |el |em hi ≡ |el |{em hi} too, under the child reading it does not"

- id: gap_A4_generator_at_main_slot
  profile: descriptive
  gap: A4
  desc: "|el !if x — same question for generators (they parse as elements)"
  udon: "|el !if @flag\n"
  readings:
    child: "el { content: [ generator if ] }"
    main_value: "el { $main = generator if }"

# --------------------------------------- A5 cardinality on delimited heads

- id: gap_A5_cardinality_inside_braces
  profile: descriptive
  gap: A5
  desc: "@{posts*} — does recognition peel the * (cardinality [0,N], head 'posts') or hand 'posts*' whole to the addressing theory?"
  deltas: 6
  udon: "!for :item @{posts*} :as post\n"
  readings:
    peeled: "reference { head: {raw: posts}, cardinality: [0,N] } — MODEL's Reference wants a cardinality field filled"
    whole: "reference { head: {raw: 'posts*'}, cardinality: [1,1] } — 'raw balanced head carried whole' (§9.1)"

- id: gap_A5_cardinality_on_held_reference
  profile: descriptive
  gap: A5
  desc: "where does a held reference's cardinality go: @<tags>* or @<tags*>? Neither is written"
  deltas: 5
  udon: |
    |r
      :a @<tags>*
      :b @<tags*>
  readings:
    outside: ":a held {0,N}; :b head 'tags*' (whole)"
    inside: ":a held {1,1} then '*' is … $main text '*'?; :b held {0,N}"

- id: gap_A5_bang_after_head
  profile: descriptive
  gap: D11
  desc: "@x! — ! is not a cardinality; is '!' then a generator guard (fails: EOL) → text? part of the head? — nothing says"
  udon: "|r @x!\n"
  readings:
    text: "reference x, then $main '!'"
    head: "reference with head 'x!' (element names exclude !, so no)"

# ------------------------------------------- A6 annotations at a value slot

- id: gap_A6_framed_annotation_right_after_label
  profile: descriptive
  gap: A6
  desc: ":a ; note — the slot has only annotation material → Error + Nil (DELTAS 11) — and the annotation owns the deeper lines, or does the deferred body?"
  deltas: 11
  udon: |
    |el
      :desc ; the description
        line one
        line two
  readings:
    body: "desc content ['line one\\nline two\\n'] (deferred body opens — 'when deeper lines follow'); annotation 'the description' — but then no Error"
    annotation_owns: "desc = Nil + Error; annotation body 'the description\\nline one\\nline two\\n' (§8: a line annotation owns everything deeper; the framed form is called a line annotation)"

- id: gap_A6_sameline_annotation_owns_element_body
  profile: descriptive
  gap: A6
  desc: "|el ; note ⏎ deeper |child — the annotation's continuation or the element's child?"
  udon: |
    |el ; note
      |child
  readings:
    child: "el { content: [annotation 'note', element child] }"
    annotation_owns: "el { content: [annotation 'note\\n|child\\n'] } — one trailing ; silently swallows the body"

- id: gap_D17_annotation_then_value_in_slot
  profile: descriptive
  gap: D17
  desc: ":a ;{x} 5 — does 5 fill the slot after the annotation (no Error)?"
  deltas: 11
  udon: "|el :a ;{x} 5\n"
  readings:
    fills: "a = 5; annotation x; no anomaly"
    error_then_main: "a = Nil + Error; annotation; $main = 5"

