# -------------------------------------------- D6/D7 brackets: bare @ and block forms

- id: gap_D6_bare_at_in_identity_vs_list
  profile: descriptive
  gap: D6
  desc: "[@x] — §6.4 says the full value grammar applies in identity brackets AND list items with @ self-announcing; §5.3 says references in identity take @{…} only. What is bare @x in each?"
  udon: |
    |el[@x]
    |el :xs [@x]
  readings:
    both_references: "$key = reference x; xs = [reference x] — K16 'no divergence between key interiors and normal values'"
    identity_text: "$key = text '@x'; xs = [reference x] — the lightly-held sugar carve (K16 addendum)"
    both_text: "neither is a reference"

- id: gap_D7_block_forms_inside_brackets
  profile: descriptive
  gap: D7
  desc: "block forms are 'out of the bracket sugar' — but what is the keep shape of [|x], [!if x], [:a 1]?"
  udon: |
    |a[|x]
    |b :xs [!if x]
    |c :ys [:a 1]
  readings:
    text_tokens: "$key text '|x'; xs ['!if' 'x']; ys [':a' 1]"
    warning: "a Warning naming the disallowed form, tokens kept"
    unspecified: "the text names the exclusion, not the outcome"

# ------------------------------------------------ D8/D4 fail-safe vs EOF/nesting

- id: gap_D8_identity_unclosed_at_true_eof
  profile: descriptive
  gap: D8
  desc: "|el[abc at EOF: EOF ≡ EOL fires the fail-safe (complete), or §11.3 'delimited still open at EOF' (incomplete-input)?"
  udon: "|el[abc"
  readings:
    complete: "$partial-key 'abc', Warning, result complete (0.10.0 vignette 2's lean)"
    incomplete: "$partial-key 'abc', Warning, result incomplete-input"

- id: gap_D4_spanning_form_nested_in_failsafe_bracket
  profile: descriptive
  gap: D4
  desc: "|el[\"abc ⏎ — the string spans lines (no fail-safe); the bracket closes at EOL (fail-safe). Innermost-first says the string is still open."
  udon: |
    |el["abc
      :n 1
  readings:
    bracket_failsafe_wins: "$partial-key 'abc' (string force-closed), Warning(s); n = 1"
    string_spans: "the string runs on: '\"abc\\n  :n 1\\n' … until a \" or EOF → the bracket never gets its EOL"

# -------------------------------------------------- D1/D2 capture kind grammar

- id: gap_D1_value_capture_kind_charset
