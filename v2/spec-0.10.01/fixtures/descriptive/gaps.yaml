  gap: D1
  desc: "<http://x> — kind 'http' body '//x'? The value form's kind charset is unstated; and is one space after 'kind:' a separator?"
  udon: "|c :a <http://example.com> :b <u64: 5> :c <2026-01-01T10:00:00>\n"
  readings:
    ident_colon: "a: kind http body '//example.com'; b: kind u64 body ' 5' or '5'; c: unlabelled (kind cannot start with a digit) body '2026-01-01T10:00:00'"
    unspecified: "no rule for the value form's kind charset or the separator"

