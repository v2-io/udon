# 0.10.1-draft fixtures — comprehensive, the MATERIAL half
# (geometry, guards, hold, elements, assignments, the Line Scan, text, annotations,
# values/types, anomalies). Design targets from CORE.md as written 2026-08-27.
# Each case cites its section. No harness yet.

# ---------------------------------------------------------------- §2 geometry

- id: geo_dedent_closes_innermost_first
  profile: comprehensive
  desc: "Nesting Rule: shallower closes everything at >= the new column — §2.2"
  udon: |
    |a
      |b
        |c
      |d
    |e
  result: complete
  adm:
    content:
      - element:
          name: a
          content:
            - element: { name: b, content: [{ element: { name: c } }] }
            - element: { name: d }
      - element: { name: e }

- id: geo_tab_in_indent_kept_warning
  profile: comprehensive
  desc: tab in indentation → Warning, line kept as text of current owner — §2
  udon: "|el\n\tprose\n"
  result: complete
  adm:
    content:
      - element:
          name: el
          content:
            - text_contains: "prose"
  anomalies:
    - { severity: warning, about: tab-in-indentation }

- id: geo_text_interior_deeper_than_base_is_literal
  profile: comprehensive
  desc: a line deeper than the content base is inside the text, markers literal — §2.2 exception / §7.2 r5
  udon: |
    |p
      base line
        |not-an-element :nor an-assignment
      |child
  result: complete
  adm:
    content:
      - element:
          name: p
          content:
            - text: "base line\n  |not-an-element :nor an-assignment\n"
            - element: { name: child }

- id: geo_rebase_shallower_warns
  profile: comprehensive
  desc: a text line shallower than the base but inside the element warns and re-bases — §7.2 r4
  udon: |
    |p
        deep first
      shallower second
  result: complete
  adm:
    content:
      - element:
          name: p
          content:
            - text_contains: "deep first"
            - text_contains: "shallower second"
  anomalies:
    - { severity: warning, about: inconsistent-indentation }

# ------------------------------------------------------------------ §3 guards

- id: guard_pipe_space_literal
  profile: comprehensive
  desc: "| followed by space is always text (Markdown tables survive) — §3"
  udon: |
    |p
      | a | b |
      |---|---|
  result: complete
  adm:
    content:
      - element:
          name: p
          content:
            - text: "| a | b |\n|---|---|\n"

- id: guard_colon_space_is_text_in_main
  profile: comprehensive
  desc: "': ' fails the guard; '3:1' unspaced is token content — §3/§6.4"
  udon: "|p ratio 3:1 today: fine\n"
  result: complete
  adm:
    content:
      - element:
          name: p
          assignments:
            - { label: "$main", value: { text: "ratio 3:1 today: fine" } }

- id: guard_emoticon_opens_assignment_collateral
  profile: comprehensive
  desc: "framed ' :-)' in sameline text passes the ':' guard (accepted collateral) — §3 note"
  udon: "|p hello :-) there\n"
  result: complete
  adm:
    content:
      - element:
          name: p
          assignments:
            - { label: "$main", value: { text: hello } }
            - { label: "-)", value: { string: there } }

- id: guard_emoticon_held
  profile: comprehensive
  desc: "attached \\ holds the ':' — the emoticon joins the open text value (Q8 reading, stated as law) — §4/§6.4"
  udon: "|el :a hello \\:-) how are you?\n"
  result: complete
  adm:
    content:
      - element:
          name: el
          assignments:
            - { label: a, value: { text: "hello :-) how are you?" } }

- id: guard_bang_forms_that_are_text
  profile: comprehensive
  desc: "!=, ![img](x), !( are text; framed !important opens a generator — §3"
  udon: |
    |p a != b and ![img](x.png) and !(y)
    |p really !important
  result: complete
  adm:
    content:
      - element:
          name: p
          assignments:
            - { label: "$main", value: { text: "a != b and ![img](x.png) and !(y)" } }
      - element:
          name: p
          assignments:
            - { label: "$main", value: { text: really } }
          content:
            - generator: { name: important }
  notes: "the second line is the K10-class hazard named in §6.4 — quote or hold sameline text that mentions a framed marker. Whether the generator is a sameline child (shown) or a stacked $main node value is gap_A4; the guard outcome (a generator opens) is what this case pins"

- id: guard_at_email_mid_token_literal
  profile: comprehensive
  desc: "@ mid-token is not at Structure Position — literal — §3"
  udon: "|el :email joe@example.com\n"
  result: complete
  adm:
    content:
      - element:
          name: el
          assignments:
            - { label: email, value: { string: joe@example.com } }

- id: guard_lt_mid_token_literal
  profile: comprehensive
  desc: "'a<b' mid-token: < is literal; only at a value-expected position does it open a capture — §3"
  udon: "|el :cmp a<b\n"
  result: complete
  adm:
    content:
      - element:
          name: el
          assignments:
            - { label: cmp, value: { string: "a<b" } }

- id: guard_lt_at_value_position_opens_capture_unclosed
  profile: comprehensive
  desc: "'< 5' at a value-expected position opens a capture; no closer → keep + Warning + incomplete-input — §3/§9.3/§11.3"
  udon: "|el :temp < 5\n"
  result: incomplete-input
  root_only: true
  adm:
    content:
      - element:
          name: el
          assignments:
            - label: temp
              value: { capture: { geometry: value, body: " 5\n" } }
  anomalies:
    - { severity: warning, about: unclosed-capture }
  notes: carried from 0.10.0's envelope behavior; a real hazard now that captures are the only typed growth surface

- id: guard_semicolon_unframed_is_content
  profile: comprehensive
  desc: "'1;2' and 'x ;c' do not annotate; only framed ' ; ' does — §8"
  udon: |
    |li ratio 1;2 done
    |li x ;c
  result: complete
  adm:
    content:
      - element:
          name: li
          assignments:
            - { label: "$main", value: { text: "ratio 1;2 done" } }
      - element:
          name: li
          assignments:
            - { label: "$main", value: { text: "x ;c" } }

# ------------------------------------------------------------------- §4 hold

- id: hold_line_initial_marker
  profile: comprehensive
  desc: "\\| at line start holds the marker; the line is root text — §4"
  udon: "\\|element not an element\n"
  result: complete
  root_only: true
  adm:
    content:
      - text: "|element not an element\n"

- id: hold_double_backslash
  profile: comprehensive
  desc: "\\\\x → text \\x — §4"
  udon: "\\\\path\\to\n"
  result: complete
  root_only: true
  adm:
    content:
      - text: "\\path\\to\n"

- id: hold_literal_elsewhere
  profile: comprehensive
  desc: "mid-token and trailing backslashes are literal — §4"
  udon: "|el :dir C:\\Users\\me :w a\\\n"
  result: complete
  adm:
    content:
      - element:
          name: el
          assignments:
            - { label: dir, value: { string: "C:\\Users\\me" } }
            - { label: w, value: { string: "a\\" } }

- id: hold_empty_forced_tail_is_empty_string
  profile: comprehensive
  desc: ":a \\ with nothing after → the empty string, no anomaly — §4"
  udon: "|el :a \\\n"
  result: complete
  adm:
    content:
      - element:
          name: el
          assignments:
            - { label: a, value: { string: "" } }
  anomalies: []

- id: hold_framed_terminates_open_value
  profile: comprehensive
  desc: "framed \\ terminates an open multi-word value and holds the rest — §6.4"
  udon: "|el :a some words \\ b :not-an-assignment\n"
  result: complete
  adm:
    content:
      - element:
          name: el
          assignments:
            - { label: a, value: { text: "some words" } }
            - { label: "$main", value: { text: "b :not-an-assignment" } }

- id: hold_framed_dead_to_annotation
  profile: comprehensive
  desc: "held text is dead to the framed ' ; ' — G6/§4"
  udon: "|el :a \\ keep ; this too\n"
  result: complete
  adm:
    content:
      - element:
          name: el
          assignments:
            - { label: a, value: { text: "keep ; this too" } }
  anomalies: []

- id: hold_attached_digit_makes_text
  profile: comprehensive
  desc: "\\7 apples → text, not integer — §6.5"
  udon: "|el :count \\7 apples\n"
  result: complete
  adm:
    content:
      - element:
          name: el
          assignments:
            - { label: count, value: { text: "7 apples" } }

- id: hold_column_anchor_idiom
  profile: comprehensive
  desc: "line-initial framed \\ occupies no column; text after it backs into that column as the base — §4"
  udon: |
    |el
      \    indented output
           deeper lines need no marker
  result: complete
  adm:
    content:
      - element:
          name: el
          content:
            - text: "    indented output\n     deeper lines need no marker\n"
  notes: base = column 2 (the backslash's); the 4 spaces after the backslash are preserved; line 2 at column 7 strips 2

- id: hold_semicolon_at_line_start
  profile: comprehensive
  desc: "\\; outputs a literal line-initial ';' — §8"
  udon: "\\; not an annotation\n"
  result: complete
  root_only: true
  adm:
    content:
      - text: "; not an annotation\n"

- id: hold_inline_element_edge_dl13
  profile: comprehensive
  desc: "framed ' ; ' after value-\\ text inside |{…} is literal — one precedence (was unspecified in 0.10.0)"
  deltas: 13
  udon: "|{a :title Home \\ Welcome! ; hm}\n"
  result: complete
  adm:
    content:
      - flow:
          - inline_element:
              name: a
              assignments:
                - { label: title, value: { string: Home } }
              content:
                - text: "Welcome! ; hm"
  notes: assumes the `}` still closes (see gap_D10 — the text does not say whether the framed hold runs through the closer)

# --------------------------------------------------------------- §5 elements

- id: el_name_charset
  profile: comprehensive
  desc: kebab and slash are name chars; other characters need quotes — §5.2
  udon: |
    |my-element
    |acme/widget
    |'weird name'
  result: complete
  adm:
    content:
      - element: { name: my-element }
      - element: { name: acme/widget }
      - element: { name: weird name }

- id: el_suffix_chars_end_name
  profile: comprehensive
  desc: "? ! * + are suffixes, not name-continue; suffixes stack — §5.2/§5.4"
  udon: "|field?!\n"
  result: complete
  adm:
    content:
      - element:
          name: field
          assignments:
            - { label: "$?", value: { bool: true } }
            - { label: "$!", value: { bool: true } }

- id: el_suffix_positions
  profile: comprehensive
  desc: suffix after name, after key, or space-separated at the end — §5.4
  udon: |
    |name?[key]
    |name[key]?
    |name[key].trait ?
  result: complete
  adm:
    content:
      - element:
          name: name
          assignments:
            - { label: "$?", value: { bool: true } }
            - { label: "$key", value: { string: key } }
      - element:
          name: name
          assignments:
            - { label: "$key", value: { string: key } }
            - { label: "$?", value: { bool: true } }
      - element:
          name: name
          assignments:
            - { label: "$key", value: { string: key } }
            - { label: "$traits", value: { string: trait } }
            - { label: "$?", value: { bool: true } }
  notes: order of `$?` vs `$key` in the first line follows source order (assignments are ordered, MODEL §3)

- id: el_suffix_touching_trait_belongs_to_trait
  profile: comprehensive
  desc: ".bar? is trait bar?; .bar ? is trait bar plus $? — §5.3/§5.4"
  udon: |
    |el.bar?
    |el.bar ?
    |el?.bar
  result: complete
  adm:
    content:
      - element:
          name: el
          assignments:
            - { label: "$traits", value: { string: "bar?" } }
      - element:
          name: el
          assignments:
            - { label: "$traits", value: { string: bar } }
            - { label: "$?", value: { bool: true } }
      - element:
          name: el
          assignments:
            - { label: "$?", value: { bool: true } }
            - { label: "$traits", value: { string: bar } }

- id: el_identity_is_contiguous
  profile: comprehensive
  desc: a .trait after a space is $main, not a trait — §5.3
  udon: "|p .gitignore is a file\n"
  result: complete
  adm:
    content:
      - element:
          name: p
          assignments:
            - { label: "$main", value: { text: ".gitignore is a file" } }

- id: el_identity_value_slot_kinds
  profile: comprehensive
  desc: "the bracket interior is a value slot: int, string, text, list, capture — §5.3"
  udon: |
    |a[1]
    |b["01"]
    |c[one two]
    |d[[one two]]
    |e[<2026>]
  result: complete
  adm:
    content:
      - element: { name: a, assignments: [{ label: "$key", value: { int: 1 } }] }
      - element: { name: b, assignments: [{ label: "$key", value: { string: "01" } }] }
      - element: { name: c, assignments: [{ label: "$key", value: { text: "one two" } }] }
      - element: { name: d, assignments: [{ label: "$key", value: { list: [{ string: one }, { string: two }] } }] }
      - element: { name: e, assignments: [{ label: "$key", value: { capture: { geometry: value, body: "2026" } } }] }

- id: el_identity_stacks_after_finished_value
  profile: comprehensive
  desc: "material after a finished value in the bracket stacks as a further $key, silently — §5.3"
  udon: "|x[\"one\" two]\n"
  result: complete
  adm:
    content:
      - element:
          name: x
          assignments:
            - { label: "$key", value: { string: one } }
            - { label: "$key", value: { string: two } }
  anomalies: []

- id: el_multiple_brackets_stack
  profile: comprehensive
  desc: each bracket is its own $key assignment, in order — §5.3
  udon: "|x[a][b]\n"
  result: complete
  adm:
    content:
      - element:
          name: x
          assignments:
            - { label: "$key", value: { string: a } }
            - { label: "$key", value: { string: b } }

- id: el_identity_embedded_reference
  profile: comprehensive
  desc: "a reference as a key takes the brace form @{key} — §5.3/§9.1 ⟨P⟩"
  deltas: 1
  udon: "|el[@{key}]\n"
  result: complete
  adm:
    content:
      - element:
          name: el
          assignments:
            - { label: "$key", value: { reference: { head: { raw: key }, cardinality: [1, 1], partial: false } } }

- id: el_identity_inline_element_key
  profile: comprehensive
  desc: "[|{x}] binds the inline element as the key — §5.3"
  udon: "|el[|{x}]\n"
  result: complete
  adm:
    content:
      - element:
          name: el
          assignments:
            - { label: "$key", value: { inline_element: { name: x } } }

- id: el_empty_closed_identity_nil
  profile: comprehensive
  desc: "identity [ ] closed → nil key — §5.3"
  udon: "|el[ ]\n"
  result: complete
  adm:
    content:
      - element:
          name: el
          assignments:
            - { label: "$key", value: { nil: true } }

- id: el_identity_unclosed_eol_failsafe
  profile: comprehensive
  desc: "unclosed identity closes at EOL → $partial-key + Warning; document continues — §5.3/§10.5"
  udon: |
    |user[jw
      :name Jo
  result: complete
  adm:
    content:
      - element:
          name: user
          assignments:
            - { label: "$partial-key", value: { string: jw } }
            - { label: name, value: { string: Jo } }
  anomalies:
    - { severity: warning, about: unclosed-identity-key }
  notes: "the declared fail-safe (§11.2) — never $key; result complete because the bracket closed at EOL, not at EOF (see gap_D8 for the at-EOF twin)"

- id: el_identity_unclosed_whitespace_kept
  profile: comprehensive
  desc: an unclosed whitespace bracket keeps its whitespace + the Warning (no nil collapse) — §5.3
  udon: "|el[ \n"
  result: complete
  adm:
    content:
      - element:
          name: el
          assignments:
            - { label: "$partial-key", value: { text: " " } }
  anomalies:
    - { severity: warning, about: unclosed-identity-key }

- id: el_anonymous_forms
  profile: comprehensive
  desc: "|[k], |.trait, |? — nameless elements, ordinary otherwise — §5.5"
  udon: |
    |[k]
    |.trait :adapter pg
    |?
  result: complete
  adm:
    content:
      - element: { name: null, assignments: [{ label: "$key", value: { string: k } }] }
      - element:
          name: null
          assignments:
            - { label: "$traits", value: { string: trait } }
            - { label: adapter, value: { string: pg } }
      - element: { name: null, assignments: [{ label: "$?", value: { bool: true } }] }

- id: el_longhand_equals_sugar
  profile: comprehensive
  desc: "designated labels are bare-writable; longhand is indistinguishable from sugar — §5.3"
  udon: "|el :$key 3890 :$traits a :$main \"T\"\n"
  result: complete
  adm:
    content:
      - element:
          name: el
          assignments:
            - { label: "$key", value: { int: 3890 } }
            - { label: "$traits", value: { string: a } }
            - { label: "$main", value: { string: T } }

- id: el_sugar_born_finished
  profile: comprehensive
  desc: deeper lines never attach to a sugar-produced assignment; they are content — §5.3
  udon: |
    |el[k] title
      body
  result: complete
  adm:
    content:
      - element:
          name: el
          assignments:
            - { label: "$key", value: { string: k } }
            - { label: "$main", value: { text: title } }
          content:
            - text: "body\n"

# ------------------------------------------------------- §5.6 inline elements

- id: inline_el_bracket_mode_and_interior_text
  profile: comprehensive
  desc: "only inline forms nest inside |{…}; intervening single spaces are interior content — §5.6"
  udon: "|ul |{li |{a Home} |{a Docs}}\n"
  result: complete
  adm:
    content:
      - element:
          name: ul
          assignments:
            - label: "$main"
              value:
                inline_element:
                  name: li
                  content:
                    - inline_element: { name: a, content: [{ text: Home }] }
                    - text: " "
                    - inline_element: { name: a, content: [{ text: Docs }] }
  notes: the first `|{` sits at the $main value-expected slot → the value (§6.4); inside, `$main` sugar does not apply

- id: inline_el_empty
  profile: comprehensive
  desc: "|{} is a valid empty anonymous inline element — §5.6"
  udon: "|el :x |{}\n"
  result: complete
  adm:
    content:
      - element:
          name: el
          assignments:
            - { label: x, value: { inline_element: { name: null } } }

- id: inline_el_multiline
  profile: comprehensive
  desc: an inline element may span lines; continuation indentation is geometry; each line keeps its terminator — §5.6
  udon: |
    |p
      Start |{em two
        lines} end.
  result: complete
  adm:
    content:
      - element:
          name: p
          content:
            - flow:
                - text: "Start "
                - inline_element: { name: em, content: [{ text: "two\nlines" }] }
                - text: " end.\n"

- id: inline_el_bare_semicolon_literal
  profile: comprehensive
  desc: "inside |{…} a bare ';' is literal; only ;{…} annotates there — §6.6/§8"
  udon: "|el :x |{a one ; two}\n"
  result: complete
  adm:
    content:
      - element:
          name: el
          assignments:
            - { label: x, value: { inline_element: { name: a, content: [{ text: "one ; two" }] } } }

- id: inline_el_close_brace_not_terminator_in_list
  profile: comprehensive
  desc: "} is not a terminator inside […]; an unclosed [ at the } is an unclosed list — §6.6"
  udon: "|el :x |{a [1 2}\n"
  result: incomplete-input
  root_only: true
  adm:
    content:
      - element:
          name: el
          assignments:
            - label: x
              value:
                inline_element:
                  name: a
                  content:
                    - list_partial: [{ int: 1 }, { int: 2 }]
  anomalies:
    - { severity: warning, about: unclosed-list }
    - { severity: warning, about: unclosed-inline-element }
  notes: "under DELTAS 12 the list now spans lines, so the } is a list item-ish byte and both forms are open at EOF (innermost-first) — expectation shape is a lean; see gap_A2"

# ------------------------------------------------------------ §6 assignments

- id: asg_root_level_label_is_text
  profile: comprehensive
  desc: "root-level :label → Warning; kept as document text including the ':' — §6.1"
  udon: ":orphan v\n"
  result: complete
  root_only: true
  adm:
    content:
      - text: ":orphan v\n"
  anomalies:
    - { severity: warning, about: root-level-assignment }

- id: asg_label_charset
  profile: comprehensive
  desc: "bare labels may contain * $ # ! ? ^ . , - + _ = ~ / : ; | anywhere; leading quote selects a quoted label — §6.2"
  udon: "|el :a:b 1 :x?! 2 :'weird key' 3 :it's 4\n"
  result: complete
  adm:
    content:
      - element:
          name: el
          assignments:
            - { label: "a:b", value: { int: 1 } }
            - { label: "x?!", value: { int: 2 } }
            - { label: "weird key", value: { int: 3 } }
            - { label: "it's", value: { int: 4 } }

- id: asg_missing_value_sole_error
  profile: comprehensive
  desc: ":label with no value material → Nil + Error (the sole core Error) — §6.2/§12.1"
  udon: "|el :k\n"
  result: complete
  adm:
    content:
      - element:
          name: el
          assignments:
            - { label: k, value: { nil: true } }
  anomalies:
    - { severity: error, about: missing-value }

- id: asg_missing_value_mid_line
  profile: comprehensive
  desc: ":a immediately followed by :b — a is Nil + Error (context terminator), b fine — §6.2"
  udon: "|el :a :b 1\n"
  result: complete
  adm:
    content:
      - element:
          name: el
          assignments:
            - { label: a, value: { nil: true } }
            - { label: b, value: { int: 1 } }
  anomalies:
    - { severity: error, about: missing-value }

- id: asg_bare_flag_shaped_label_is_missing_value
  profile: comprehensive
  desc: "no flag semantics: a bare :disabled? is a label missing its value — §6.2"
  udon: "|button :disabled? :type submit\n"
  result: complete
  adm:
    content:
      - element:
          name: button
          assignments:
            - { label: "disabled?", value: { nil: true } }
            - { label: type, value: { string: submit } }
  anomalies:
    - { severity: error, about: missing-value }

- id: asg_four_states
  profile: comprehensive
  desc: "Absent · Nil · False · True are distinct — §6.2/§10.1"
  udon: "|el :n nil :m null :f false :t true\n"
  result: complete
  adm:
    content:
      - element:
          name: el
          assignments:
            - { label: n, value: { nil: true } }
            - { label: m, value: { nil: true } }
            - { label: f, value: { bool: false } }
            - { label: t, value: { bool: true } }
  anomalies: []

- id: scan_unquoted_text_terminators
  profile: comprehensive
  desc: "unquoted text values run to a framed guard-confirmed marker — four assignments — §6.4"
  udon: |
    |element :something something else
      :another one  :and-another <please>
  result: complete
