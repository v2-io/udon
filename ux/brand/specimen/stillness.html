/* Layout: a split desk, washi paper on the left and slate on the right, one editor window resting on each — the same .udon file in both lights, with the sumi mark above and a printed card on the paper side. Committed single look: both themes are always shown. */
:root {
  color-scheme: light;
  --mono: "Victor Mono", "VictorMono Nerd Font Mono", ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  --sans: "Jost", "Gill Sans", "Avenir Next", "Segoe UI", sans-serif;
  --brand: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  --kana: "Noto Serif JP", "Hiragino Mincho ProN", "Yu Mincho", serif;

  /* washi (light) */
  --p-ground: #e9e3d8;
  --p-win: #f8f4ec;
  --p-chrome: #efe9de;
  --p-edge: #e0d8ca;
  --p-ink: #2d2a26;
  --p-text: #4a4540;
  --p-prose: #5d574f;
  --p-attr: #876a51;
  --p-key: #6b7457;
  --p-quiet: #b3a999;
  --p-comment: #a59c8d;
  --p-guide: #e5dccc;
  --p-line: #efe6d6;
  --p-accent: #c03b28;
  --p-code: #eee7da;
  --p-mark: #241f1a;      /* sumi: off-black, faintly brown */
  --p-feather: #3a3129;   /* the dry-brush edge, a shade warmer */
  --p-word: #1d1c1a;
  --p-sub: #4e4842;

  /* slate (dark) */
  --s-ground: #25292d;
  --s-win: #1f2020;
  --s-chrome: #252628;
  --s-edge: #303230;
  --s-ink: #ece6db;
  --s-text: #cbc4b8;
  --s-prose: #aba499;
  --s-attr: #c2a182;
  --s-key: #9eab8c;
  --s-quiet: #5e5b57;
  --s-comment: #737068;
  --s-guide: #303134;
  --s-line: #2b2b2e;
  --s-accent: #d0583c;
  --s-code: #2b2c2f;
  --s-mark: #cf5a3a;
  --s-feather: #db6d49;
  --s-word: #e9e4da;
  --s-sub: #c4beb3;

  --seal: #c03b28;
  --card: #f6f2e8;
}
* { box-sizing: border-box; }
body { background: var(--p-ground); color: var(--p-ink); font-family: var(--sans); }
.defs { position: absolute; width: 0; height: 0; overflow: hidden; }

.stage { display: grid; grid-template-columns: 1fr 1fr; }
.half {
  position: relative;
  overflow: hidden;
  min-width: 0;
  display: flex; flex-direction: column; align-items: center; gap: 44px;
  padding-block: 64px 120px;
  padding-left: max(clamp(16px, 4vw, 60px), env(safe-area-inset-left, 0px));
  padding-right: max(clamp(16px, 4vw, 60px), env(safe-area-inset-right, 0px));
}
.paper { padding-bottom: 280px; }
.half > .mark, .half > .desk { width: 100%; max-width: 700px; position: relative; z-index: 1; }

.paper {
  background: radial-gradient(120% 90% at 50% 40%, #efe9df 0%, var(--p-ground) 70%, #e2dbcd 100%);
  --win: var(--p-win); --chrome: var(--p-chrome); --edge: var(--p-edge);
  --ink: var(--p-ink); --text: var(--p-text); --prose: var(--p-prose); --attr: var(--p-attr); --key: var(--p-key);
  --quiet: var(--p-quiet); --comment: var(--p-comment); --guide: var(--p-guide); --line: var(--p-line);
  --accent: var(--p-accent); --code: var(--p-code); --mark: var(--p-mark); --feather: var(--p-feather); --word: var(--p-word); --sub: var(--p-sub);
  --shadow: 0 34px 60px -30px rgba(74, 58, 38, .42), 0 8px 20px -10px rgba(74, 58, 38, .2);
  --syn-text: #2b2824; --syn-comment: #8c8376; --syn-node: #c0432a; --syn-id: #2b5c6b; --syn-class: #586b44;
  --syn-attr: #945b27; --syn-val: #2e6657; --syn-heading: #161412; --syn-quote: #615a50; --syn-punct: #968d80;
  --syn-code-bg: rgba(35, 33, 30, .065); --syn-num: #a69e90; --syn-guide: rgba(40, 36, 30, .08); --syn-row: rgba(180, 75, 45, .065);
}
.slate {
  background: radial-gradient(120% 90% at 50% 30%, #2e3338 0%, var(--s-ground) 65%, #1e2125 100%);
  --win: var(--s-win); --chrome: var(--s-chrome); --edge: var(--s-edge);
  --ink: var(--s-ink); --text: var(--s-text); --prose: var(--s-prose); --attr: var(--s-attr); --key: var(--s-key);
  --quiet: var(--s-quiet); --comment: var(--s-comment); --guide: var(--s-guide); --line: var(--s-line);
  --accent: var(--s-accent); --code: var(--s-code); --mark: var(--s-mark); --feather: var(--s-feather); --word: var(--s-word); --sub: var(--s-sub);
  --shadow: 0 34px 70px -28px rgba(0, 0, 0, .7), 0 8px 20px -10px rgba(0, 0, 0, .45);
  --syn-text: #d8d1c2; --syn-comment: #706b63; --syn-node: #e06448; --syn-id: #7cafc2; --syn-class: #9cb380;
  --syn-attr: #d6a165; --syn-val: #82b8a6; --syn-heading: #f5efe4; --syn-quote: #9e9689; --syn-punct: #6e6960;
  --syn-code-bg: rgba(234, 228, 216, .08); --syn-num: #59564f; --syn-guide: rgba(234, 228, 216, .065); --syn-row: rgba(193, 97, 67, .08);
  color-scheme: dark;
}

/* header lockup. --H is the bowl's height; everything else is measured off the brush strokes
   (logo units, viewBox y 160..752): bowl bottom y=744 is the subtitle's baseline and the stamp's
   bottom; the inner right stroke's tip y=660 is the UDON baseline; the stamp is one subtitle cap tall. */
.mark {
  --H: clamp(118px, 11vw, 156px);
  position: relative;
  display: flex; align-items: flex-end; justify-content: flex-start;
  gap: calc(var(--H) * .26);
  padding-left: calc(var(--H) * .12);
}
.m-mono { height: var(--H); width: auto; color: var(--mark); flex: none; display: block; }
.m-words { display: flex; flex-direction: column; align-items: flex-start; min-width: 0; margin-bottom: calc(var(--H) * 8 / 592); }
.m-title { display: flex; align-items: last baseline; gap: calc(var(--H) * .085); }
.m-latin { font-family: var(--brand); font-weight: 400; font-size: calc(var(--H) * .295); line-height: 1; letter-spacing: .025em; color: var(--word); text-box: trim-both cap alphabetic; }
.m-kana { font-family: var(--kana); font-weight: 400; font-size: calc(var(--H) * .09); letter-spacing: .12em; color: var(--sub); opacity: .72; line-height: 1; }
.sub { font-family: var(--brand); font-weight: 300; font-size: calc(var(--H) * .0994); letter-spacing: .01em; line-height: 1; color: var(--sub); white-space: nowrap; text-box: trim-both cap alphabetic; margin-top: calc(var(--H) * 84 / 592 - 1cap); }

/* desk props: photographed stones and inkwells, cut out with their own soft shadows. The photo is lit
   from above, so dark stones turn only a few degrees, or their lit side would swing round. */
.prop { position: absolute; pointer-events: none; z-index: 0; height: auto; max-width: none; user-select: none; }
.paper .ink   { width: clamp(150px, 13vw, 212px); top: -50px; right: -58px; transform: rotate(7deg); }
.paper .rnd   { width: clamp(160px, 14vw, 226px); bottom: -48px; left: -70px; transform: rotate(-5deg); }

.slate .pale  { width: clamp(132px, 11.5vw, 186px); top: -56px; right: -44px; transform: rotate(-4deg); }
.slate .ink   { width: clamp(150px, 13vw, 206px); top: 46%; right: -78px; }

.slate .slab.a { left: -14%; bottom: -60px; width: 56%; height: 46%; background: #30343a; }

/* window */
.desk { position: relative; }
.win { position: relative; z-index: 1; background: var(--win); border-radius: 9px; box-shadow: var(--shadow); border: 1px solid var(--edge); overflow: hidden; min-width: 0; }
.chrome { display: flex; align-items: stretch; background: var(--chrome); border-bottom: 1px solid var(--edge); height: 36px; }
.dots { display: flex; gap: 7px; align-items: center; padding: 0 14px; }
.dots i { width: 11px; height: 11px; border-radius: 50%; display: block; }
.dots i:nth-child(1) { background: #e0625a; }
.dots i:nth-child(2) { background: #e2b14a; }
.dots i:nth-child(3) { background: #5db95e; }

  position: absolute; z-index: 2; right: -30px; bottom: -228px;

.at { color: var(--syn-attr); }

.pk { color: var(--syn-punct); }
.st { font-weight: 600; }
.em { font-style: italic; }
.cd { color: var(--syn-val); background: var(--syn-code-bg); border-radius: 3px; }

<script type="text/plain" id="src">; an anthology of small forms
|book[stillness].anthology :title Stillness in Small Forms
  :editor |person Jane Doe :born 1971
  :tags [haiku tanka cinquain]

  |preface
    ## On brevity
    A haiku holds **one moment**, and the reader brings the rest.
    The form asks only *three lines*, counted five, seven, five.[^1]

    > The pond is still there. The frog has long since gone.
    > — a note in the margin of a library copy

    [^1]: Counted in *on*, the sound units of Japanese.

  |chapter[pond] The Old Pond
    |poem[furuike].haiku :by Bashō :year 1686
      An old silent pond
      a frog jumps into the pond
      splash! Silence again. ;{tr. unknown}

    Read it twice: once for the frog, once for the silence after.

  |chapter[form] Counting the Form ; draft
    Three short forms, by line and count:

    | Form     | Lines | Count     |
    | -------- | ----- | --------- |
    | haiku    | 3     | 5-7-5     |
    | tanka    | 5     | 5-7-5-7-7 |
    | cinquain | 5     | 2-4-6-8-2 |

    ---
    1. Read the poem aloud once.
    2. Read it again, *slower*.
    3. Write `one line` of your own, then [compare](notes/form.md).

  |colophon :set Inter :printed 2026 \ Printed on washi, bound by hand</script>

        if (s[i] === ";" && s[i + 1] === "{") {
          flush();
          const j = s.indexOf("}", i); out += pair("cm", ";{", s.slice(i + 2, j), "}"); i = j + 1; continue;
        }
        seg += s[i++];
      }
      flush();
      expecting = false;
    }
    if (s[0] === "|") head(); else attr();
    while (i < s.length) {
      if (s[i] === " ") {
        const j = i; while (s[i] === " ") i++;
        out += s.slice(j, i);
        if (i >= s.length) break;
        if (s[i] === "|" && WORD.test(s[i + 1] || "")) { expecting = false; head(); continue; }
        if (s[i] === ":" && WORD.test(s[i + 1] || "")) { attr(); continue; }
        if (s[i] === ";" && (s[i + 1] === " " || i + 1 === s.length)) { out += W("cm", D(";") + esc(s.slice(i + 1))); break; }
        if (s[i] === "\\" && (s[i + 1] === " " || i + 1 === s.length)) { out += sp("nd", "\\"); i++; expecting = false; continue; }
      }
      if (s[i] === "[" && expecting) {
        const j = s.indexOf("]", i);
        out += pair("vl", "[", s.slice(i + 1, j), "]");
        i = j + 1; expecting = false; continue;
      }
      run();
    }
    return out;
  }

  // ---------- indentation guides ----------
  const indentOf = l => l.match(/^ */)[0].length;
  const isBlank = l => /^\s*$/.test(l);
  function guideIndent(n) {
    if (!isBlank(lines[n])) return indentOf(lines[n]);
    let a = n - 1, b = n + 1;
    while (a >= 0 && isBlank(lines[a])) a--;
    while (b < lines.length && isBlank(lines[b])) b++;
    const up = a >= 0 ? indentOf(lines[a]) : 0, dn = b < lines.length ? indentOf(lines[b]) : 0;
    return Math.min(up, dn);
  }
  function guides(n) {
    let out = "";
    for (let k = 0; k + 2 <= n; k += 2) out += '<span class="ig">  </span>';
    return out + " ".repeat(n % 2);
  }

  function render(n) {
    const line = lines[n];
    const ind = guideIndent(n);
    if (isBlank(line)) return guides(ind);
    const body = line.slice(ind);
    let html;
    if (body[0] === ";" && body[1] !== "{") html = W("cm", D(";") + esc(body.slice(1)));
    else if (/^[|:][A-Za-z]/.test(body)) html = structural(body);
    else html = prose(body);
    return guides(ind) + html;
  }

  const rows = lines.map((_, n) =>
    `<div class="ln${n + 1 === ACTIVE ? " active" : ""}"><span class="no">${n + 1}</span><span class="tx">${render(n)}</span></div>`
  ).join("");

  const mini = lines.map(l => isBlank(l)
    ? '<span class="blank"></span>'
    : `<span style="margin-left:${Math.round(indentOf(l) * 0.9)}px;width:${Math.min(40, Math.round(l.trim().length * 0.55))}px"></span>`
  ).join("");

  const icons = `
    <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.2" aria-hidden="true"><path d="M3 5.5h7.5a2.5 2.5 0 0 1 0 5H6"/><path d="M5 3.5 3 5.5l2 2"/></svg>
    <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.2" aria-hidden="true"><rect x="2.5" y="3" width="11" height="10" rx="1.2"/><path d="M8 3v10"/></svg>
    <svg viewBox="0 0 16 16" fill="currentColor" aria-hidden="true"><circle cx="3.5" cy="8" r="1"/><circle cx="8" cy="8" r="1"/><circle cx="12.5" cy="8" r="1"/></svg>`;

  const tickTop = `calc(16px + ${((ACTIVE - 0.5) / lines.length * 100).toFixed(2)}% - ${((ACTIVE - 0.5) / lines.length * 36).toFixed(1)}px)`;

  const html = `
    <div class="chrome">
      <div class="dots"><i></i><i></i><i></i></div>
      <div class="tab"><b></b>stillness.udon<span class="x">×</span></div>
      <div class="acts">${icons}</div>
    </div>
    <div class="body">
      <div class="code" tabindex="0" aria-label="stillness.udon source">${rows}</div>
      <div class="mini" aria-hidden="true"><div class="view"></div>${mini}</div>
      <div class="mark-tick" aria-hidden="true" style="top:${tickTop}"></div>
    </div>`;

  const mark = `
    <svg class="m-mono" viewBox="304 160 414 592" role="img" aria-label="UDON mark"><use href="#u-mono"/></svg>
    <svg class="m-seal" viewBox="693 709 36 36" aria-hidden="true"><use href="#u-seal"/></svg>
    <div class="m-words">
      <div class="m-title"><span class="m-latin">UDON</span><span class="m-kana" lang="ja">うどん</span></div>
      <span class="sub">Universal Document Object Notation</span>
    </div>`;

  document.querySelectorAll("[data-editor]").forEach(w => { w.innerHTML = html; });
  document.querySelectorAll("[data-mark]").forEach(w => { w.innerHTML = mark; });
})();
</script>

</html>
